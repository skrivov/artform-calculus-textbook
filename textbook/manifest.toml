[[statement]]
key = "prop:tetractys-intwits"
number = "1.10"
kind = "proposition"
title = "The two tetractys interpretations coexist"
optional = false
source = "chapters/01-foundations.tex:3978"
book_sha256 = "f220c1efa67c7ad6900278bf166e662a777234c66adba20c66a9cc982fc4b2bf"
tier = "B"
batch = "B4"
needs = "profiles and witnesses of §1.6; the spectra by `decide`"
status = "proved"
lean_statement = "Artform.Statement.tetractysIntwits"
lean_proof = "Artform.tetractysIntwits"
reviewed = "2026-10-11"
review_text_sha256 = "68e5de4d781a8e901e1805ac6654de804e0dbb083b165402f375d889a9812a05"
review_term_sha256 = "9f76a7ee4c52b14b145a3d87ac179978762beabed79a48800605fe91199ced1d"
fidelity = """
The palette P is the rod of four rows, row r having r + 1 phases, written locally 0..r; the drawn names 1-10 are a legend and are not modelled. A laying gives, for a row with k phases and a tick t of the clock of 12, a local phase; layRec(k, t) = t mod k and layDiv(k, t) = kt/12 in natural numbers, which is the floor. 'There are profiles' is carried by the definitions Crec and Cdiv, which the review covers. Each has the tapestries on CycleTime(12) as endpoints and the layings as realizers. A laying produces theta from F when every row shows only its own phases and theta is the tapestry the laying lays. The law is the covering (or grouping) equation in every row, the phase typing, and the period spectrum read off the tapestry produced: {{1,2,3,4}} (or {{1,12,12,12}}), as multisets. The covering and grouping equations are those of Section 1.5, at every tick, modulo k, with the shift taken on the cycle. The book's remark after the proposition, that c_div records the grouping equation at the cuts, follows from that. The endpoints I_rec and I_div are the tables of Figures 1.25 and 1.40, entry by entry. 'w_rec = (l_rec, c_rec) in IntWit' is: some witness has realizer l_rec, and likewise for div. 'Gamma lists the two profiles' is: Gamma is a set of profiles containing both. 'Gives two elements of Sem' is: the two tagged witnesses are elements, by their types, and they are different, for any witnesses of each kind."""
review_context_sha256 = "813b101c432d90f732becf1ca8be47c2dfa123a31646fbdf5b5e4e5141062b8d"

[[statement]]
