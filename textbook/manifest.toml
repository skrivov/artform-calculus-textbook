status = "stated"
lean_statement = "Artform.Statement.adjoints"
lean_proof = "Artform.adjoints"
reviewed = ""
review_text_sha256 = ""
review_term_sha256 = ""
fidelity = """
Families of sets over I are functions I -> Type, with arrows the families of fibre maps (Mathlib's product category). f* is Mathlib's Pi.comap; Sigma_f and Pi_f take the tagged choice and the complete assignment over the fibres {j // f j = i}. The two adjunctions are Mathlib's Adjunction. Mathlib stores a unit and a counit, but an adjunction is the same as the book's hom-set bijection natural in both variables (Adjunction.homEquiv one way, Adjunction.mkOfHomEquiv the other), and the proof builds each adjunction from the book's bijection. The statement asserts that the adjunctions exist, as the book does. Index sets and families lie in one universe."""

