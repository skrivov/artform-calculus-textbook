[[definition]]
key = "def:gauge-covariant-law"
number = "5.35"
title = "Gauge-covariant law and realizer"
optional = false
source = "chapters/04-physical-laws.tex:4132"
book_sha256 = "e4474d6b3e60ef241e49b2cf20eaf53ec85a33bec7fa8ce5cf51bc2b50f35d57"
planned_home = "Artform.GaugeCovariant (Ch05/Matter)"
first_needed = "B2"
status = "defined"
lean = ["Artform.DetRealizer.GaugeCovariant", "Artform.GaugeAction", "Artform.GaugeAction.CovariantInvariants", "Artform.GaugeAction.CovariantLaw", "Artform.GaugeAction.CovariantMove", "Artform.Law.GaugeCovariant", "Artform.LawInSteps.DetRealizer.GaugeCovariant", "Artform.LawInSteps.GaugeCovariant", "Artform.RelRealizer.GaugeCovariant", "Artform.StochRealizer.GaugeCovariant"]
reviewed = ""
fidelity = """
A gauge action is declared position by position on the values of a frame, which covers the book's action on links, vertices and further fields; no group structure is assumed. A move is covariant when its guard holds at h.x whenever at x, and its proposal on the write footprint is h applied to its proposal at x (the footprints belong to the profile). The invariants hold at x exactly when they hold at h.x, read together. Realizers: the same batch up to order (deterministic), the same set of batches (relational), the same weights (stochastic, for any weight type with 0, which also covers a coherent realizer's coefficients); stated for the realizers of Law and, slot by slot, of LawInSteps. The coherent realizer of the quantum chapters is not formalized."""

