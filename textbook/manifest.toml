reviewed = ""
review_text_sha256 = ""
review_term_sha256 = ""
fidelity = """
A law in steps (Definition 5.12) has finitely many steps, each with its moves (process profiles), a score that says which step is open at each slot, repeating with a period, and invariants, each with its checkpoints. Slot t runs from boundary t to boundary t + 1, and a checkpoint is the boundary at the close of its slot. Legality is read at boundaries: a state is legal at boundary t when every invariant checked at t holds. Definition 5.9's condition and the realizer's evidence are read the same way: from a state legal at boundary t, a move of the open step, or the selected batch, leads to a state legal at t + 1. This is the reading of the book's proof ('gives each invariant whose checkpoint is slot n+1 at x_{n+1}'), and a law of Section 5.4 is the case of one step, open at every slot, with every invariant checked at every boundary. Well posed is total (a nonempty batch at legal states, except where the score allows an empty one) and order-free (every reordering of a selected batch gives the same state). The stretch is any n slots from any slot s, generalizing the book's stretch from the start of the score. 'Exactly one run' is: exactly one trajectory from the start follows the realizer; its legality at every checkpoint is the last conclusion. 'The order does not change its states' is stated batch by batch. The realizer may choose by slot, not only by open step, which generalizes it."""

