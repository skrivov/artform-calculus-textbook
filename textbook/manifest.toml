reviewed = ""
review_text_sha256 = ""
review_term_sha256 = ""
fidelity = """
A state interpretation gives each frame a type of legal states and each declared operation a total function on them; a guarded move's source carries its evidence, as in the book. S on scripts is the composite of the actions (Mathlib's Paths.lift), the empty script acting as the identity. State-equivalence: S f x = S g x for every legal state x. Preservation is two-sided, as in 1.16. 'The quotient is a category' is stated as in 1.16. 'Its state interpretation is faithful' is: some functor S_Q from the quotient to Set satisfies S_Q o pi = S (an equality of functors), and S_Q is faithful."""

