fidelity = """
Patches are tables of the frame whose positions are the cells and whose values say whether a cell is present, ordered by inclusion. The rules form a control: process profiles, each with a phase, and the row of the control tapestry saying which phase is open at each slot. Each rule attaches its write footprint, which lies in the finite window W. Hypothesis 1 is persistence: a rule enabled at a patch stays enabled at every larger patch. A run is an execution under the control: each slot makes a batch of rules whose phase is open; every policy's run is one, and every execution is the run of a policy that remembers the slot. Definition 3.30 is read with work pending from the slot at which it is enabled, not from its first offer as Section 3.9 says: with the printed definition, read as the remark after it reads it, the proposition fails (FINDINGS.md, F1). Application fairness asks the policy to select a rule that has not been selected, stays enabled each time its phase is open, and whose phase keeps opening. The conclusion: from some slot on, the state is the least closed patch above the seed."""
