[[statement]]
key = "thm:ml-transfer"
number = "13.8"
kind = "theorem"
title = "The third-order transfer"
optional = false
source = "chapters/matter-laboratory/03-transfer.tex:19"
book_sha256 = "147ff09b5fc6ee1243c1777bda884bdb44b31b43eaf69caa226816bbe3196e43"
tier = "C"
batch = "B8"
needs = "third-order term of the energy law"
status = "stated"
lean_statement = "Artform.Statement.mlTransfer"
lean_proof = "Artform.mlTransfer"
reviewed = ""
review_text_sha256 = ""
review_term_sha256 = ""
fidelity = """
The setting is that of Theorem 11.20 and Proposition 11.19, on which the cubic moment rests: a finite group with a triplet in SU(3), irreducible, whose 3^3 has exactly one invariant; any number of slots and any order of the modes; a complete family with an energy table declaring E3 on the members isomorphic to the triplet or its conjugate; kappa > 0; any orthogonal projector P onto the zero-flux sector. 'The third-order term' is read as the book's proof reads it: P V R V R V P, with R = -(kappa H_E)^-1 off the sector, written as -1/kappa times the electric energy of the table 1/E (zero on the trivial member, so zero on the tables constant in the link value; on the colourless states this is -(kappa H_E)^-1 off the zero-flux sector); the other third-order terms carry the factor P V P, and the statement includes P V P = 0. A real triplet is one with real matrices; a complex triplet is read through the centre (an element acting by omega), as every complex model of the book has it, which makes the words with a conjugated entry average to zero (the book's reason, that 3 x 3 x 3bar has no invariant, follows from it). The words are written with epsilon in place of the signs of the orderings, and 'L = the words' holds on the zero-flux sector at every link value. The four finite models are stated as instances for any number of slots: the cube and icosahedral groups real, C3 x A5 and Valentiner's group complex. SU(3) itself is not covered: its projector averages over the link with the invariant measure, which, as for Theorem 11.20, is not used."""
review_return = "The operator theorem assumes a finite group and omits SU(3)."

