lean_proof = "Artform.mlTransferValues"
reviewed = ""
review_text_sha256 = ""
review_term_sha256 = ""
fidelity = """
For the four finite groups L = P V^3 P literally, for every orthogonal projector P onto the zero-flux sector, read on the values of zero-flux states; for SU(3), whose projector would average over the link with the invariant measure, L is the form Theorem 13.8 gives it for a complex triplet (its words), so the SU(3) part rests on that reading. The modes are ordered x before y and, within an end, colour before spin (the book's verifier). The signs and amplitudes left open by the book are the computed ones: L(D_x q_y(m)) = -6 q_x(m) D_y, L(H_x q_y(m)) = 6 q_x(m) H_y, and for the real triplets L psi_0 = -12(c1 + c2 + c3 + c4) with c1 = |full_x>, c4 = |full_y>. The component along |full_x> is the pairing with it. Figure fig:ml-transfer-spectra is read by total quark number N: (-6)^4 6^4 at N = 3, 9; the same at N = 5, 7 for the real triplets and no states for the complex ones; at N = 6, (-24)^1 0^18 24^1 (real) and (-12 sqrt2)^1 0^16 (12 sqrt2)^1 (complex); L is zero on every other sector. 'Under the law' the coefficient of L is 1/(kappa E3)^2 with the declared E3 = 4/3, for every kappa != 0."""
review_return = "The SU(3) word matrix is not connected to the projected operator."

