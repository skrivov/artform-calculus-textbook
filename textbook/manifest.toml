A profile for artforms of a type Src has endpoints, realizers indexed by the artform and the endpoint, a relation 'produces' and a law; the law may read the artform and the endpoint. A witness is a realizer with a certificate, a Lean proof that it produces the endpoint and obeys the law. 'A profile of Gamma that applies to F' is read as: a profile of Gamma for artforms of the type of F. The tag in Sem is the profile with its proof of membership. 'Selects nothing' and 'does not change raw artform equality' hold by construction and are not stated."""

