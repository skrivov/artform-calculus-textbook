review_term_sha256 = ""
fidelity = """
Patches are sets of cells of any type. F_W is any map of patches that attaches only cells of the window W, F(X) included in X union W, as the F_W of Section 3.8 does, and it is extensive; W is finite and the seed X_0 is any patch. The conclusion is the book's: the sequence X_{t+1} = F_W(X_t) is increasing and constant from some step N on, with the bound N at most the number of cells of W outside X_0 that the proof gives."""

[[statement]]
key = "prop:fair-closure"
number = "3.32"
kind = "proposition"
title = "Fair closure"
optional = false
source = "chapters/03-pattern-geometry.tex:2265"
book_sha256 = "9e11e3a858306d578f3f692fcf6cac8cbb315fac2763126beb4d31a182ea3ca1"
tier = "B"
batch = "B5"
needs = "least closed set; fairness hypotheses"
status = "stated"
lean_statement = "Artform.Statement.fairClosure"
lean_proof = "Artform.fairClosure"
reviewed = ""
review_text_sha256 = ""
review_term_sha256 = ""
fidelity = """
Patches are tables of the frame whose positions are the cells and whose values say whether a cell is present, ordered by inclusion. The rules form a control: process profiles, each with a phase, and the row of the control tapestry saying which phase is open at each slot. Each rule attaches its write footprint, which lies in the finite window W. Hypothesis 1 is persistence: a rule enabled at a patch stays enabled at every larger patch. A run is an execution under the control: each slot makes a batch of rules whose phase is open; every policy's run is one, and every execution is the run of a policy that remembers the slot. Definition 3.30 is read with work pending from the slot at which it is enabled, not from its first offer as Section 3.9 says: with the printed definition, read as the remark after it reads it, the proposition fails (FINDINGS.md, F1). Application fairness asks the policy to select a rule that has not been selected, stays enabled each time its phase is open, and whose phase keeps opening. The conclusion: from some slot on, the state is the least closed patch above the seed."""

[[statement]]
key = "prop:growth-symmetry"
number = "3.33"
kind = "proposition"
title = "Symmetry of growth"
optional = false
source = "chapters/03-pattern-geometry.tex:2344"
book_sha256 = "01a0a9d9abaa7e23e30051522d7283f406eadf215fef826d1e2d9d6920cfbf5c"
tier = "B"
batch = "B5"
needs = "group actions on runs"
status = "stated"
lean_statement = "Artform.Statement.growthSymmetry"
lean_proof = "Artform.growthSymmetry"
reviewed = ""
review_text_sha256 = ""
review_term_sha256 = ""
fidelity = """
The rule is a set of attachments, each persistent; positivity is not used. Motions are permutations of the cells, G and S subgroups with S in G; a motion carries a profile to the profile with transported guard, footprints and update, and a patch to its image. (i) The patches some run of n batches reaches form a set that every motion of S carries to itself. (ii) 'The policy that makes every enabled attachment at once' is formalized by its effect, attaching every cell that some enabled attachment attaches: when two enabled attachments attach the same face, as in Figure 3.28 from tick 1 on, they are not compatible in the sense of Section 3.8 (disjoint writes), so they do not form a batch; the remark after Definition 2.6 allows equal writes. (iii) One enabled attachment that attaches one fresh face c (as Section 3.8 requires of a new top cell); keeping S forces every motion of S to fix c. Freshness is needed: without it (iii) is false."""

