fidelity = """
Set is Lean's category Type (universe 0) and FinSet is Mathlib's FintypeCat. A topos is Definition 1.28 as written: a terminal object, pullbacks, binary products with exponentials (Definition 1.23 presupposes products) and a subobject classifier. In both categories the classifier is required to be Fin 2 = {0,1} with true picking 1. The classifying condition ranges over monomorphisms rather than subobjects; the two agree, since the condition is unchanged when a monomorphism is replaced by an isomorphic one."""

