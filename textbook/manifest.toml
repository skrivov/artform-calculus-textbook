review_text_sha256 = "9fd1cb41ea551c7938bad89db495bda8b8ffa7bc2ff7927f1785c5ae1f760b90"
review_term_sha256 = "b2c8c44ceb3a6931f74709428b7bad476fd1f3724db1fa2765604460a31e1b6e"
fidelity = """
The declared frames and operations are any quiver: a type F of frames, and for frames A and B a type of operations A -> B. This covers the book's frames of Section 1.9 and any other declared data. A list is a Mathlib Quiver.Path, concatenation is Path.comp (first f, then g, which the book writes g o f), and Art^syn is Mathlib's free category Paths F. 'Form a category' is stated as associativity and unit laws of concatenation, together with the facts that in Art^syn the identities are the empty lists and composition is concatenation. 'Preserved by composition' is two-sided: f ~ f' and g ~ g' give g o f ~ g' o f'. 'Gives a quotient category' is: some category Q and functor pi from Art^syn to Q, bijective on objects and full, identify two parallel lists exactly when the relation relates them. This determines the book's quotient up to isomorphism."""
review_context_sha256 = "7883e2bc11f2c62a545e9bc093205f1f6d6b4820a6b8d8a62e85ad457c12de03"

