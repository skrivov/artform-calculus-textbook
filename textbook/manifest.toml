lean_proof = ""
reviewed = ""
review_text_sha256 = ""
review_term_sha256 = ""
fidelity = """
Vertices are points of R^3. A rotation of the icosahedron is a matrix in SO(3) that carries every vertex to a vertex. 'There are at most 60' and 'all sixty carry the vertex set to itself' are stated together as: there are exactly 60 such rotations. 'The matrix that carries the frame' is stated as exactly one matrix, which holds because the frame is a basis. The trace counts are stated for every real t."""

