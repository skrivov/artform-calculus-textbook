[[statement]]
key = "prob:markov"
number = "4.4"
kind = "proposition"
title = "Exit-level closure"
optional = false
source = "chapters/probability/08-memory.tex:19"
book_sha256 = "e4631abb369d2fecab4b979bcd26bd7084695246d1a2fae8b5b7e9b5f06439ee"
tier = "C"
batch = "B5"
needs = "conditional laws on finite path spaces; Markov property"
status = "stated"
lean_statement = "Artform.Statement.exitLevelClosure"
lean_proof = "Artform.exitLevelClosure"
reviewed = ""
review_text_sha256 = ""
review_term_sha256 = ""
fidelity = """
The experiment is any probability space run for N phrases. exit t is the exit X_t at the t-th boundary, with X_0 the initial exit, which may be random. past t is the complete past before phrase t + 1, with values in a countable type (the book's complete states are finite), and pair t is the response pair (a, b) of phrase t + 1. Each event {past t = s} is measurable and each pair is a random variable, as every set is an event in the book's finite model. 'Uniform on B x B conditional on every positive-probability complete past': each of the four pairs has conditional probability 1/4 given each such past. 'The next exit is x + ab, with no further dependence on that past': X_{t+1} = X_t + ab in Fin 2, at every outcome. 'Later updates preserve the previous exit records' is read as: the complete past at t determines X_0, ..., X_t, which is how the book's proof uses it; the archive cells themselves are not modelled. The recorded history includes X_0. 'Has conditional transition law K(y | x)': P(X_{t+1} = y | X_0 ... X_t = h) = K(y | h_t) for every recorded history h of positive probability, as Section 4.5 conditions only on histories of positive probability. 'Depends only on its current exit': any two recorded histories of positive probability, of any lengths, that end in the same exit give the same next-exit law. Probabilities take values in [0, infinity], as Mathlib's measures do."""

