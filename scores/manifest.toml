[[statement]]
key = "T4"
label = "T4"
title = "One mode on a prime dial"
source = "ALGEBRA-OF-SCORES.md §4.2 (T4)"
statement = """
Let S = F_p (constant stencils, one mode). The group presented by merging (R1) and Whitehead's rule (R3), on X = M(1) and Y = K(1), is SL_2(F_p) for p = 5, 7, 11 and 13. So two constant scores give the same tick exactly when the two rules turn one into the other. The Lean form: the realizer X -> M(1), Y -> K(1) reaches every law in SL(2, ZMod p), and two words in X and Y have the same law exactly when they are equal in the group presented by the relators of R1 (all stencils f, g) and R3 (all units u, all stencils f), with M(f) = X^f and K(f) = Y^f for 0 <= f < p."""
lean_statement = "Artform.Scores.Statement.oneModeComplete"
lean_proof = "Artform.Scores.oneModeComplete"
reviewed = ""
review_text_sha256 = ""

[[statement]]
key = "T7:invariance"
label = "T7"
title = "The class of a law"
source = "ALGEBRA-OF-SCORES.md §4.3 (T7); finding 057 §1"
statement = """
(T7, Latimer-MacDuffee) The laws of phase t, up to processing, correspond one to one with the classes of fractional ideals of A_t = S[λ]/(λ^2 - tλ + 1). The law T goes to the class of (c, λ - a). Finding 057 §1 assumes that t^2 - 4 is not a square in F(x); the ideal is cut out by T's left eigenvector u = (c, λ - a), for which u T = λ u on C_t. The Lean form holds over every integral domain S with t^2 - 4 not a square in its fraction field: u T = λ u, and processing, T' = P T P^-1 with P invertible, keeps the class of (c, λ - a), since the two ideals differ by non-zero-divisor factors. The one-to-one correspondence (every class is a law's, and the laws of one class are processing-equivalent) is not in Lean."""
lean_statement = "Artform.Scores.Statement.classInvariance"
lean_proof = "Artform.Scores.classInvariance"
reviewed = ""
review_text_sha256 = ""

[[statement]]
key = "T7:trivial-class"
label = "T7"
title = "The trivial class"
source = "ALGEBRA-OF-SCORES.md §4.3 (T7); finding 057 §1 (the trivial class)"
statement = """
Finding 057 §1: T is in the trivial class iff Q_T represents a unit. A vector v with that property is a cyclic vector: P = [v | T v] gives T P = P C_t, where C_t = [[0, -1], [1, t]] is the companion tick. The Lean form proves the direction from a cyclic vector, over every integral domain with t^2 - 4 not a square in its fraction field: if det[v | T v] = Q_T(v) is a unit, then T [v | T v] = [v | T v] C_t, and (c, λ - a) is in the class of A_t itself. The converse is not in Lean."""
lean_statement = "Artform.Scores.Statement.trivialClass"
lean_proof = "Artform.Scores.trivialClass"
reviewed = ""
review_text_sha256 = ""

[[statement]]
key = "T12:reading"
label = "T12"
title = "The reading"
source = "ALGEBRA-OF-SCORES.md §4.4 (T12)"
statement = """
From rest the output depends only on (t, a): b_n = [cos n theta + ((a - d)/2) sin n theta / sin theta] b_0, so the pair (t, a) of phase and reading is the complete invariant of the output. The Lean form proves the invariance: two laws with the same phase and reading give the same flux b at every tick from (b, e) = (b_0, 0)."""
lean_statement = "Artform.Scores.Statement.readingDetermines"
lean_proof = "Artform.Scores.readingDetermines"
reviewed = ""
review_text_sha256 = ""

