source = "ALGEBRA-OF-SCORES.md §4.5 (T13); finding 037, Theorem Q, part 2"
statement = """
Finding 037, Theorem Q, part 2: Σ_μ ⊂ Γ¹(μ) for every μ, with equality exactly when μ ≤ 4. The table: μ = 1, the tick a rotation of order 6, Σ_μ = SL(2,Z), index 1, relations KMK = MKM and (KMK)⁴ = 1; μ = 2, rotation of order 4, Γ⁰(2) = Γ¹(2), index 3, relations (MK)⁴ = 1 and (MK)²K = K(MK)²; μ = 3, rotation of order 3, Γ¹(3) ≅ Z ∗ Z₃, index 8, relation (MK)³ = 1; μ = 4, parabolic, Courant's limit, Γ¹(4), free, index 12, no relations; μ ≥ 5, hyperbolic, explodes, free and thin, index ∞, no relations. The Lean form: Γ¹(μ) is the group of the integer laws with b ≡ 0 and a ≡ d ≡ 1 mod μ (`gammaUpper`); Σ_μ is generated by K(1) and M(−μ) (`stepGroup`). The inclusion and the equality exactly when μ ≤ 4 hold for every positive integer μ. The indices are 1, 3, 8, 12, and `Subgroup.index = 0`, infinite index, for μ ≥ 5. The relations are stated as identities that hold. Not stated: that these relations present the groups, and the ledger's Γ¹(3) ≅ Z ∗ Z₃. The proof differs from the ledger's for μ ≥ 5: a nonempty alternating word in powers of K and M sends the vector (9, 4) into the ping-pong sets |x| < 2|y| and μ|y| < 2|x|, which do not hold it, so no nonzero power of the parabolic law [[−35, 81], [−16, 37]] that fixes (9, 4) lies in Σ_μ. Its μ-th power lies in Γ¹(μ), and its powers give infinitely many cosets. The ledger uses cusp widths and the Euler characteristic instead."""
