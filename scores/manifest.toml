[[statement]]
key = "R6"
label = "R6"
title = "Blocking"
source = "ALGEBRA-OF-SCORES.md §3 (R6) and §1, Definition 3"
statement = """
(R6) Blocking commutes with the realizer: [[B(w)]] = B([[w]]). Blocking by a sublattice of index m reads the artform A = (Λ, c, R) as B(A) = (Λ′, mc, R): a state of A as a state with mc channels per cell of Λ′. The Lean form: when the stencil ring S is a free module over S′ on a basis of m places, the blocking B (entry by entry, the matrix of multiplication by a stencil) of the law of every two-channel score w is the law of the blocked score B(w). In B(w) each step is replaced by its placed steps, the shears between the 2m channels. The coset basis that makes every sublattice blocking a case is R6:cosets."""
lean_statement = "Artform.Scores.Statement.blocking"
lean_proof = "Artform.Scores.blocking"
reviewed = "2026-10-30"
review_text_sha256 = "a009a95f1aae188ac409a34e70604f3dfcefcfee632807dc0940f737c303c328"

[[statement]]
key = "R6:red-black"
label = "R6"
title = "Red-black on the blocked artform"
source = "ALGEBRA-OF-SCORES.md §1, Definition 3; finding 044 (places and red-black)"
statement = """
Red-black on Z^2 blocks by the checkerboard sublattice, of index 2, so 2c channels, and on B(A) the placed step is translation-invariant (Definition 3). Places are invisible inside one step, K_red K_black = K, and red-black, K_red M½ K_black M½, has period 2 (finding 044). The Lean form, for every index-2 blocking with the places red (the basis vector 1) and black (x, with x^2 = d a unit): the red and black kicks together are the blocked kick; the blocked shift by x turns the red-black tick into the black-red tick; and the red-black tick is the blocking of a law of the artform only if κ^2 β = 0, where β is the black part of the move's stencil. The checkerboard of Z^2 with the face form is R6:checkerboard."""
lean_statement = "Artform.Scores.Statement.redBlack"
lean_proof = "Artform.Scores.redBlack"
reviewed = "2026-10-30"
review_text_sha256 = "661c29c746f8cfbb8f37f9748e9682c1882fa8a084fd9e2fdfa87b836eef68da"

[[statement]]
key = "R6:cosets"
label = "R6"
title = "The coset basis of a sublattice"
source = "ALGEBRA-OF-SCORES.md §1, Definition 3"
statement = """
Definition 3: fix a sublattice Λ′ ⊂ Λ of index m, such that the place is a union of cosets of Λ′. The blocked artform B(A) = (Λ′, mc, R) reads a state of A as a state with mc channels per cell of Λ′. To read a state so is to read the stencils R[Λ] as a free module over the stencils R[Λ′] of the sublattice, with one place for each coset. The Lean form holds for every commutative ring R, every additive commutative group Λ (Z^d among them) and every subgroup Λ′: if t_0, ..., t_(m-1) are coset representatives, each cell a being λ′ + t_i for exactly one i, then the shifts x^(t_i) are a basis of R[Λ] over R[Λ′], which acts on R[Λ] through the inclusion of Λ′. With this basis, R6 and R6:red-black apply to every sublattice blocking."""
lean_statement = "Artform.Scores.Statement.cosets"
lean_proof = "Artform.Scores.cosets"
reviewed = "2026-10-30"
review_text_sha256 = "3340dbb7df34876a1c4f2bdc094ea8e2e220a26c58f576b496db1dbb0245beda"

[[statement]]
key = "R6:checkerboard"
label = "R6"
title = "Red-black on the checkerboard, with the face form"
source = "ALGEBRA-OF-SCORES.md §1, Definitions 2 and 3; finding 044 (places and red-black)"
statement = """
Red-black on Z^2 blocks by the checkerboard sublattice, of index 2 (Definition 3). Red-black is K_red M½ K_black M½ (finding 044), with the half move M½ = M(-λg/2) of the book's face form, whose stencil in the plane is g = 4 - S = 4 - x - 1/x - y - 1/y (Definition 2). It has period 2: it couples each mode k to k + (π, π). The Lean form holds over every commutative ring R in which 2 is invertible. The checkerboard Λ′, the cells (a, b) with a + b even, has the coset representatives 0 and e_1, so the stencils R[x^±1, y^±1] have the basis 1, x over R[Λ′] = R[u^±1, v^±1], with u = xy and v = x/y. The square x^2 = uv is a unit of R[Λ′]. The face form g has the red part 4 and the black part -(1 + 1/u + 1/v + 1/(uv)). When κ^2 λ ≠ 0, the red-black tick with the half move M(-λg/2) is the blocking of no law of the artform: by R6:red-black's obstruction, since κ^2 times the black part of -λg/2 has the constant term κ^2 λ/2. Lean writes λ as ℓ, and a cell as a pair (a, b) of integers."""
lean_statement = "Artform.Scores.Statement.checkerboardRedBlack"
lean_proof = "Artform.Scores.checkerboardRedBlack"
reviewed = "2026-10-30"
review_text_sha256 = "66281ae2201a7a5d665dd3b0e80a10482ac93a89fdf73e5ccf328b82e5069358"

[[statement]]
key = "T1:field"
label = "T1"
title = "One dimension, every dial"
source = "ALGEBRA-OF-SCORES.md §4.1 (T1)"
