[[statement]]
key = "T13:cells"
label = "T13"
title = "The cells that a tick fixes"
source = "ALGEBRA-OF-SCORES.md §4.5 (T13); finding 038, Theorem U, parts 4 and 5"
statement = """
Finding 038, Theorem U, part 4: T_μ fixes a vertex, an edge or a face exactly when its trace 2 − μ is 0, ±1 or ±2 mod n: μ ≡ 0, 1, 2, 3, 4. The fixed cells are the same on every dial: μ ≡ 0, a turn about the vertex E; μ ≡ 1, a face turn of {B, E, [1:−1]}; μ ≡ 2, an edge flip of {B, [1:−1]}; μ ≡ 3, a face turn of {B, [−2:1], [1:−1]}; μ ≡ 4, a turn about [−2:1]. Part 5: the exploding mode μ = 8 is an edge flip on C₃, the turn about E on C₄ and a face turn on C₅. It fixes a cell exactly on C₂ … C₈, and turns freely on every C_n with n ≥ 9. Its order in SL(2,Z/n) is 12, 24, 24 and 240 on C₃₆, C₁₂₀, C₃₆₀ and C₃₆₀₀. The Lean form: for any law, a fixed vertex gives the trace ±2, a fixed edge 0 or ±2, and a fixed face (n ≥ 3) ±1 or ±2; the trace of T_μ is 2 − μ. Each of the five ticks fixes its cell, on every dial. For n ≥ 9 the tick at μ = 8 fixes no vertex, edge or face; the three cases on C₃, C₄ and C₅, and the four orders, are stated. "Fixes" for an edge or a face means as a set."""
