[[statement]]
key = "T15:methods"
label = "T15"
title = "Every method is light"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); finding 042, Theorem S5.2"
statement = """
Finding 042, Theorem S5.2: for any sequence of changes, the painted rows obey u(t+1) + u(t-1) = S_t u(t), with S_t = P_t + P_(t-1). This is the book's 1D tick with a neighbour sum that the score sets change by change. S_t cuts the row into intervals of two kinds: mirror boxes [a, b], on which S_t is S_mirror of the box, whose end cells make a place in one of the two changes, so that a place made is a mirror; and dodges, pairs {p, p+1} swapped by both changes, on which S_t = [[0, 2], [2, 0]], a doubled bond. The Lean form holds for paint in every commutative additive monoid. A change is an involution of the positions that moves each position at most one place. The painted rows (the number on the bell in each position) obey u(t+1) = P_t u(t) and the tick. For two changes A and B and each position i: on a dodge (A i = B i, not i) the sum is the doubled bond u(A i) + u(A i), and B swaps the partner back; elsewhere P_A u + P_B u is the box's neighbour sum, with a wall where neither change swaps, and at a wall a place is made. Lean states the walls, not the list of intervals that they cut. The extents of T15 (finding 043) are the entries T15:rankin, T15:lifting and T15:fibonacci."""
lean_statement = "Artform.Scores.Statement.methodsAreLight"
lean_proof = "Artform.Scores.methodsAreLight"
reviewed = "2026-10-30"
review_text_sha256 = "f154dfbfc82f956a74ce7181c83b6ae9735d5a928c51412679c3120a2d4643e2"

[[statement]]
key = "T15:plain-hunt"
label = "T15"
title = "Plain hunt is light in a mirror box"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); finding 042, Theorem S5.1"
statement = """
Finding 042, Theorem S5.1, for N >= 3: (1) P_X + P_Y = S_mirror. (2) The painted rows of plain hunt obey u(t+1) + u(t-1) = S_mirror u(t), the book's one-dimensional tick at Courant number 1 in a box with mirror walls, for any numbers on the bells. (3) Every bell is a light ray: it moves one place per change, and at each wall it lies for one change and turns back. (4) The plain course has 2N rows. The Lean form proves (1) and (2) for every N, and (3) by explicit positions for every N: after t changes the bell from the position b is at fold(start(b) + t), the point start(b) + t of a circle of 2N places folded onto the box, so it moves one place per change or lies at a wall, and for N >= 2 it never lies twice running. For (4), with N >= 3: the rows after s and t changes are equal exactly when s = t mod 2N. Lean numbers the positions from 0, the ledger from 1."""
lean_statement = "Artform.Scores.Statement.plainHuntIsLight"
lean_proof = "Artform.Scores.plainHuntIsLight"
reviewed = "2026-10-30"
review_text_sha256 = "d7e7b5c5503b6758095cb490b0e903932ca1e059f812aaad481f9f7a2a22732a"

[[statement]]
