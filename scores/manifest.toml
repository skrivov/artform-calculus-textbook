[[statement]]
key = "T15:fewest"
label = "T15"
title = "The fewest back-steps"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); finding 043, Theorem S5.4, parts 2 and 3"
statement = """
Finding 043, Theorem S5.4, parts 2 and 3: PSL(2,Z/4) and PSL(2,5), the octahedron's and the icosahedron's rotation groups, need exactly two back-steps over (K, M). The fewest back-steps on every SL and PSL(2,Z/n), n = 3 … 13, forward steps K, M: for n = 3, 6, 7, 9, 12, zero: a forward extent. For n = 4, 5, 10, 13, exactly 2: zero is excluded by parity or lifting, one by Lemma 3, and two suffice. For n = 8, 0 is open; if back-steps are needed, at least 3: no placement of two is consistent; PSL(2,Z/8) rings with 3; for SL(2,Z/8) none was found. For n = 11, at least 3: no placement of two back-steps is consistent; none with 3 was found in 8000 samples. The Lean form states, on SL(2,Z/n) and PSL(2,Z/n) = SL(2,Z/n)/{±1}, with K = K(1) and M = M(-1): `FewestBack … 0` for n = 3, 6, 7, 9, 12; `FewestBack … 2` for n = 4, 5, 10, 13; for n = 8 and 11, no run has exactly one or exactly two back-steps; for n = 11 every run has at least three; and PSL(2,Z/8) has a run with exactly three. What the ledger leaves open stays open: whether Z/8 has a forward extent, and whether SL(2,Z/8) or Z/11 has a run with three. The exclusions of one and two back-steps come from the balance, with a kernel computation of the powers of c and the offsets; the runs are certificates."""
