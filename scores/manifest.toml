[[statement]]
key = "T15:coxeter"
label = "T15"
title = "The presentation of the bells"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15) and §5 (the row 'bells')"
statement = """
T15: the artform has N positions, its values a permutation. The steps are the changes, products of disjoint adjacent transpositions s_i. The rules are Coxeter's s_i^2 = 1, (s_i s_(i+1))^3 = 1 and (s_i s_j)^2 = 1 for |i - j| >= 2. The semantics is S_N. Known: expressive and complete (Moore 1897). The Lean form, for every N = n + 1: the law of the generator s_i is the swap of the neighbours i and i + 1, and the rules are the relations of Mathlib's Coxeter matrix A_n (CoxeterMatrix.A n). Every permutation is the law of a word (expressive), and two words have the same law exactly when they are equal in the group that the rules present (complete)."""
