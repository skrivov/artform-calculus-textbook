[[statement]]
key = "T15:back-step"
label = "T15"
title = "One back-step"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); finding 043, Lemma 3"
statement = """
Finding 043, Lemma 3: suppose a Hamiltonian cycle uses forward steps A, B everywhere except one backward step A^-1 or B^-1. Then AB or BA lies in ⟨c⟩, c = A^-1 B. The proof places the defect at the identity by right multiplication; Rankin's links then join the forward predecessors x = B^-1 h and cx = A^-1 h of every other vertex h; the links break at h = A^-1 (A^-2 takes B and B^-1 A^-1 takes A) and at h = A and h = B (c^-1 takes B and c takes A); within the coset ⟨c⟩ the choices run from c (A) to c^-1 (B) along unbroken links, which is impossible unless the third broken link lies in ⟨c⟩, that is unless (AB)^-1 ∈ ⟨c⟩. The back-step B^-1 gives BA ∈ ⟨c⟩ in the same way. The Lean form holds for every finite group G and every permutation σ of G (not only a Hamiltonian cycle) that steps forward, σ(x) ∈ {Ax, Bx}, at every element but one, x_0: if σ(x_0) = A^-1 x_0 then AB ∈ ⟨A^-1 B⟩, and if σ(x_0) = B^-1 x_0 then BA ∈ ⟨A^-1 B⟩. The defect stays at x_0, so the links run along the coset ⟨c⟩x_0."""
lean_statement = "Artform.Scores.Statement.oneBackStep"
lean_proof = "Artform.Scores.oneBackStep"
