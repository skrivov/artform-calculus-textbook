**GAC2:indexed-original-connection-blocks (derive the old blocks from the complete formula).**
At homogeneous zero frame and constant original connection, index the four distinct triples
(a,b,c)=(012,013,023,123) by A_a=x*t_b wedge t_c, A_b=y*t_c wedge t_a,
A_c=z*t_a wedge t_b. The COMPLETE one-site density restricts exactly to
2*t*eta_a*eta_b*eta_c*(x^2+y^2+z^2)-(1-2*t)*(eta_c*x*y+eta_b*x*z+eta_a*y*z).
For each repeated index b, put A_a=z_a*t_a wedge t_b for the three ascending a!=b.
Its complete density is eta_b*(t*sum z_a^2-sum_(a<c) z_a*z_c), equivalently half its
quadratic pairing with R_b(t), whose diagonal is2*t*eta_b and off-diagonal-eta_b.
The012 distinct restriction is explicitly half the quadratic pairing with the ORIGINAL B_t.
These are eight checked restriction identities, not an unproved full24-block diagonalization
or a full frequency-dependent inverse. No measured retrospective saving is claimed.
See [finding170](findings/170-indexed-original-connection-density-blocks.md).
