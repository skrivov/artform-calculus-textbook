title = "Verified exact arithmetic programs for the original native block"
source = "ALGEBRA-OF-SCORES.md section 8 (GAC2:verified-native-block-programs)"
statement = """
**GAC2:verified-native-block-programs (same arbitrary rational input and original inverse).**
Two explicit register programs, direct dense and rank-one, return the ORIGINAL
connectionBlock^-1*z for EVERY rational3-vector z. All register reads are valid. Counting
coefficient-scale and add gates with precomputed native constants and free negation/copy,
the direct program uses9 scales and6 adds; the rank-one program uses4 scales and5 adds.
The programs and counts are checked in Lean, with no output hypothesis. This is a prospective
exact-operation reduction on these declared general-input programs. It is NOT a historical
speedup over the older selected r/w source, already one-multiplication optimal, nor a checker
runtime, universal bit-complexity or physical resource claim.
See [finding186](findings/186-verified-native-block-exact-arithmetic-programs.md).
