label = "R4"
title = "Balanced movers"
source = "ALGEBRA-OF-SCORES.md §3 (R4)"
statement = """
The law product W(u) W(1)^-1 is diag(u,u^-1) and is multiplicative in u over every commutative ring. The time-order score h(u) = w(1)^-1 w(u), represented by balancedScore, realizes that same law."""
lean_statement = "Artform.Scores.Statement.balancedRule"
lean_proof = "Artform.Scores.balancedRule"
reviewed = "2026-10-30"
review_text_sha256 = "77fd114b3f77da21512f944cc5cab233cb5c0e152022cee5486118396d1cfb71"

