title = "Complete original flat quadratic variation on periodic fields"
source = "ALGEBRA-OF-SCORES.md section 8 (GAC2:complete-flat-quadratic-variation)"
statement = """
**GAC2:complete-flat-quadratic-variation (the full declared native flat formula).** For any
finite additive commutative lattice group X and characteristic-zero field K, retain all original
16+24 coordinates, four shifts and six faces. In the native unit-spacing alpha=lambda=0,
beta=sigma=1 model, define the complete quadratic formula
S2(q)=sum_(x,faces){g(Lf+UA,star*K A)+g(C,star*Q(A))}+kappa*sum eta_i*eta_j*eta(theta,theta)
using the literal wedge/complement/transport/plaquette/torsion maps in QuadraticDefs.
The bivector bracket equals its original matrix commutator, commutes with internal star and
preserves g. The raw contact maps back to the ORIGINAL quadratic curvature reading.
The displayed B(q,p) is bilinear and S2(q)=B(q,q). Hence, for all epsilon,q,p,
S2(q+epsilon*p)=S2(q)+epsilon*(B(q,p)+B(p,q))+epsilon^2*S2(p).
The complete coefficient formula is retained; no analytic remainder of the nonlinear action,
full nonlinear native solution, physical quotient or positivity is claimed.
See [finding165](findings/165-complete-original-flat-quadratic-variation.md).
"""
