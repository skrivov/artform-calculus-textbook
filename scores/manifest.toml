[[statement]]
key = "T4"
label = "T4"
title = "One mode on a prime dial"
source = "ALGEBRA-OF-SCORES.md §4.2 (T4)"
statement = """
Let S = F_p (constant stencils, one mode). The group presented by merging (R1) and Whitehead's rule (R3), on X = M(1) and Y = K(1), is SL_2(F_p) for p = 5, 7, 11 and 13. So two constant scores give the same tick exactly when the two rules turn one into the other. The Lean form: the realizer X -> M(1), Y -> K(1) reaches every law in SL(2, ZMod p), and two words in X and Y have the same law exactly when they are equal in the group presented by the relators of R1 (all stencils f, g) and R3 (all units u, all stencils f), with M(f) = X^f and K(f) = Y^f for 0 <= f < p."""
lean_statement = "Artform.Scores.Statement.oneModeComplete"
lean_proof = "Artform.Scores.oneModeComplete"
reviewed = "2026-10-30"
review_text_sha256 = "7b54a0463f3333ca4a47ca384b0af01ecc687a29b42e9936d722700485a4e100"

[[statement]]
key = "T7:invariance"
label = "T7"
title = "The class of a law"
source = "ALGEBRA-OF-SCORES.md §4.3 (T7); finding 057 §1"
statement = """
(T7, Latimer-MacDuffee) The laws of phase t, up to processing, correspond one to one with the classes of fractional ideals of A_t = S[λ]/(λ^2 - tλ + 1). The law T goes to the class of (c, λ - a). Finding 057 §1 assumes that t^2 - 4 is not a square in F(x); the ideal is cut out by T's left eigenvector u = (c, λ - a), for which u T = λ u on C_t. The Lean form holds over every integral domain S with t^2 - 4 not a square in its fraction field: u T = λ u, and processing, T' = P T P^-1 with P invertible, keeps the class of (c, λ - a), since the two ideals differ by non-zero-divisor factors. The one-to-one correspondence itself is the entries T7:one-to-one and T7:onto."""
lean_statement = "Artform.Scores.Statement.classInvariance"
lean_proof = "Artform.Scores.classInvariance"
reviewed = "2026-10-30"
review_text_sha256 = "adb49a505c36b8bb08290dfe6f1ee0eaae19692a3ba2fce0bf1a5f9e137f2c93"

[[statement]]
key = "T7:trivial-class"
label = "T7"
title = "The trivial class"
source = "ALGEBRA-OF-SCORES.md §4.3 (T7); finding 057 §1 (the trivial class)"
statement = """
Finding 057 §1: T is in the trivial class iff Q_T represents a unit. A vector v with that property is a cyclic vector: P = [v | T v] gives T P = P C_t, where C_t = [[0, -1], [1, t]] is the companion tick. The Lean form proves both directions, over every integral domain with t^2 - 4 not a square in its fraction field: (c, λ - a) is in the class of A_t itself exactly when some v has det[v | T v] = Q_T(v) a unit, and for such a v, T [v | T v] = [v | T v] C_t."""
lean_statement = "Artform.Scores.Statement.trivialClass"
lean_proof = "Artform.Scores.trivialClass"
reviewed = "2026-10-30"
review_text_sha256 = "5fea29a884e4d9dba5271f06caf8975e21d3e865598c66d02654c32ab599e882"

[[statement]]
key = "T7:one-to-one"
label = "T7"
title = "One class, one law up to processing"
source = "ALGEBRA-OF-SCORES.md §4.3 (T7); finding 057 §1"
statement = """
(T7, Latimer-MacDuffee) The laws of phase t, up to processing, correspond one to one with the classes of fractional ideals of A_t = S[λ]/(λ^2 - tλ + 1). The law T goes to the class of (c, λ - a). This entry is the injectivity of the map, with its invariance (T7:invariance) as the converse direction. The Lean form holds over every integral domain S with t^2 - 4 not a square in its fraction field: the ideal (c, λ - a) of a law of phase t is nonzero, and two laws T and T' of phase t have their ideals in the same class exactly when T' = P T P^-1 for an invertible matrix P over S. A class is as in T7:invariance: α I = β J with non-zero-divisors α and β of A_t. In the proof, the A_t-ideal (c, λ - a) is the S-span of c and λ - a, since u T = λ u; two generating pairs of one ideal, both S-independent, differ by a matrix in GL_2(S), and the eigenvector equation then gives T' = P^-1 T P."""
lean_statement = "Artform.Scores.Statement.classesOneToOne"
lean_proof = "Artform.Scores.classesOneToOne"
reviewed = "2026-10-30"
review_text_sha256 = "a2eb6bc02b592ebfd912f4d6e2e0f76fe9a77ae2656075b4abd941c902925e29"

[[statement]]
key = "T7:onto"
label = "T7"
title = "Every class is a law's"
source = "ALGEBRA-OF-SCORES.md §4.3 (T7); finding 057 §1"
