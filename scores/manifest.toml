[[statement]]
key = "GAC:block-memory"
label = "GAC:block-memory"
title = "Exact block memory and prepared autonomy"
source = "ALGEBRA-OF-SCORES.md section 7 (GAC:block-memory)"
statement = """
**GAC:block-memory (exact block memory and prepared autonomy).** Let K be a semiring and Y,Z be
K-modules with additive commutative monoids. For linear blocks A:Y to Y, B:Z to Y, C:Y to Z, D:Z to Z,
let x_(n+1)=A*x_n+B*z_n and z_(n+1)=C*x_n+D*z_n. For every natural n,
z_n=D^n*z_0+sum_(j<n) D^(n-1-j)*C*x_j, and
x_(n+1)=A*x_n+B*D^n*z_0+sum_(j<n) B*D^(n-1-j)*C*x_j.
No auxiliary initial datum is omitted. If a linear J:Y to Z satisfies C*y+D*J*y=J*(A*y+B*J*y)
for every y, the full orbit from (y,J*y) is (U^n*y,J*U^n*y), with U(y)=A*y+B*J*y.
An arbitrary visible map U satisfying A*x+B*z=U(x) for every x,z exists if and only if B=0.
For the rational quarter turn (x,z) maps to (z,-x), with the fixed initial preparation z=0, there is no
single map U from rational readings to rational readings satisfying x_(n+1)=U(x_n) for every initial x
and every n. This quarter turn is the existing Whitehead score at unit 1.
These are algebraic block laws; no native gravity memory kernel is inferred without its actual block bridge.
See [finding 110](findings/110-exact-block-memory-and-prepared-autonomy.md).
"""
lean_statement = "Artform.Scores.GravityBridge.Statement.blockMemory"
lean_proof = "Artform.Scores.GravityBridge.blockMemory"
reviewed = "2026-10-30"
review_text_sha256 = "b6114f3fca866d5c1fcf7375fd35c8a2f9e197220da47008012115224c440e18"

[[statement]]
key = "GAC:stencil-support"
label = "GAC:stencil-support"
title = "Exact stencil support and restricted-field agreement"
source = "ALGEBRA-OF-SCORES.md section 7 (GAC:stencil-support)"
statement = """
**GAC:stencil-support (exact support and restricted-field agreement).** Let K be a semiring and G an
additive monoid with decidable equality. For a finite-support convolution kernel p with coefficients in K,
define Act(p,v)(x)=sum_a p_a*v(x+a). Then Act(p*q,v)=Act(p,Act(q,v)); its action on all fields distinguishes
kernels; and support(p*q) is contained in support(p)+support(q). On G=Z^d, if every coordinate of a support
point of p has integer absolute value at most r, and likewise q at most s, then p*q has radius at most r+s.
The support inclusion can be strict: over rational kernels on Z, the displacement 1 belongs to the sum of
the supports of 1-T and 1+T but not to their product's support.
For every N=n+1, the rational N-by-N matrix with every entry 1/N fixes every constant field and has no zero
entry. Thus exact agreement with the identity on constant fields can coexist with a globally dense kernel.
This does not forbid a local law agreeing on that restricted subspace or identify restricted agreement with
physical equivalence. See [finding 111](findings/111-exact-stencil-support-and-restricted-fields.md).
"""
lean_statement = "Artform.Scores.GravityBridge.Statement.stencilSupport"
lean_proof = "Artform.Scores.GravityBridge.stencilSupport"
reviewed = "2026-10-30"
review_text_sha256 = "45f701bc5b6669dbcb0eff42d0ac36979e91d5ccef20c2de873f9798f189a30c"

[[statement]]
key = "GAC:r2-norm-chart"
label = "GAC:r2-norm-chart"
title = "Original odd norm and broader chart"
source = "ALGEBRA-OF-SCORES.md section 7 (GAC:r2-norm-chart)"
statement = """
**GAC:r2-norm-chart (the original odd norm excludes the shared factor).** Put
h=a*s+2-3a, d=(1+q^2)*(1+R)^2*(a^2+G)-[1+q^2*(2a-1)^2+4*q^2*G], and
F(gamma)=4*h^2*normSq(T(gamma))-R*s*(3-s)*Delta(gamma)^2 with the original T and Delta.
For all real q,R,a,gamma,s, F(gamma)-F(-gamma)=16*q*R*gamma*[2*q^2*h^2-s*(3-s)*d], where G=gamma^2.
For q^2=103/2, R>0, G>=0, s>0 and the original normal equation N=0, the necessary norm constraint
s*(3-s)*d=2*q^2*h^2 implies 2-3a is nonzero and excludes all four ell_i=n_i=0.
Consequently if gamma is nonzero, both original phase norms and both original J traces vanish,
and R>0, s>0, N(a,gamma^2,s)=0, at least one ell_i is nonzero, without assuming s>1/3.
For fixed R,a,G with 2-3a nonzero, two normal latitudes satisfying all four real rows must coincide.
This is a fixed-parameter fibre statement, with no existence or global-finiteness conclusion, and no
single-sign feasibility or physical phase-selection verdict. See
[finding 112](findings/112-native-r2-odd-norm-and-broader-chart.md).
"""
lean_statement = "Artform.Scores.GravityBridge.Native.R2.Statement.normChart"
lean_proof = "Artform.Scores.GravityBridge.Native.R2.normChart"
reviewed = "2026-10-30"
review_text_sha256 = "510047da614f5777b88825c1444371176f2efcbe613499b19af6f177acd7758c"

[[statement]]
key = "GAC:r2-phase-transfer"
label = "GAC:r2-phase-transfer"
title = "Guarded original phase and norm transfer"
source = "ALGEBRA-OF-SCORES.md section 7 (GAC:r2-phase-transfer)"
statement = """
**GAC:r2-phase-transfer (guarded original phase and norm transfer).** Use zeta=1-a+i*gamma,
P=(1+R)*(1-i*q)*(1-zeta), Q=1+i*q-2*i*q*conjugate(zeta), and the original L,T,Delta.
For all real q,R,a,gamma, normSq(P)-normSq(Q)=Delta and conjugate(P)*L-Q*conjugate(L)=T.
For Delta nonzero the original real-linear phase equation P*V+Q*conjugate(V)=-2*H*L
is equivalent to V=-2*H*T/Delta, denoted Vreg. If K^2=s, K*H=a*s+2-3a and K is nonzero,
then normSq(Vreg)=R*(3-s) is equivalent to the phase-norm polynomial F(gamma)=0.
If also s,3-s,E=1-zeta and Delta are nonzero, the conjunction of the original phase equation,
its norm equation and the unmultiplied affine trace is equivalent to V=Vreg, F=0 and J=0.
Every clearing guard is retained. This is the reduced original polynomial/phase system, not a proof
of normal cubic reconstruction, singular-phase or zero-K sectors, native full40 histories, or a
physical phase-selection rule. See [finding 113](findings/113-native-r2-guarded-original-phase-transfer.md).
"""
