[[statement]]
key = "GAC:local-processing"
label = "GAC:local-processing"
title = "Two-channel inverse and orbit support bounds"
source = "ALGEBRA-OF-SCORES.md section 7 (GAC:local-processing)"
statement = """
**GAC:local-processing (two-channel inverse and orbit support bounds).** Over any commutative ring K,
on Z^d, let P be a two-by-two determinant-one matrix of finite-support kernels, with coordinate radius
at most r in every entry. Its inverse has radius at most r in every entry. If a two-channel matrix law T
has entry radius at most t, every natural n satisfies radius((P*T*P^-1)^n)<=n*t+2*r.
Processing is accounted once at each end of the orbit, using (P*T*P^-1)^n=P*T^n*P^-1.
The same-radius inverse statement does not extend to three channels: there are explicit rational
one-dimensional matrices A,Q with A*Q=Q*A=I, radius(A)<=1 and radius(Q)>1.
The witness has A=[[1,p,0],[0,1,p],[0,0,1]] and Q=[[1,-p,p^2],[0,1,-p],[0,0,1]], where p is one shift.
No one-dimensional expressiveness theorem is applied to other dimensions or to native gravity's twenty
trace channels. See [finding 115](findings/115-local-processing-inverse-and-channel-scope.md).
"""
