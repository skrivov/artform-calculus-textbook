[[statement]]
key = "T15:transport"
label = "T15"
title = "Ringing on a lattice only transports"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); findings 042 and 082; finding 016, Theorem K"
statement = """
ALGEBRA-OF-SCORES.md, T15: from finding 082 (the physics thread), painted ringing in 2D is a linear permutation law, so by Theorem K (finding 016) it can only transport. Theorem K: a translation-invariant, finite-range, linear, spectrally stable integer law has branches λ(k)^q = ε e^(i n·k): every mode on a branch moves rigidly by the lattice vector n every q ticks. Lean does not prove Theorem K, which rests on Laurent's theorem on the torsion points of subvarieties of G_m^n. It proves the permutation case directly, in any dimension: for every additive commutative group Λ of cells and every number c of channels, a permutation σ of Λ × Fin c that commutes with the shifts of Λ has a q ≥ 1 and lattice vectors v_i with σ^q (z, i) = (z + v_i, i). So every painted field u moves rigidly: its value at (z, i) is at (z + v_i, i) after q ticks. A periodic score of changes is one such σ per period, blocked by Definition 3 if its changes are not invariant under the whole of Λ."""
