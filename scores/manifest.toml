label = "GAC2:native-singular-source-strata"
title = "Singular strata and retained source range guards"
source = "ALGEBRA-OF-SCORES.md section 8 (GAC2:native-singular-source-strata)"
statement = """
**GAC2:native-singular-source-strata (test before clearing denominators).** The original
distinct B_t has nonzero null vectors at t=1/4 and-1/2; the indexed repeated R_b(t)
has nonzero null vectors at t=1 and-1/2 for every b. At t=1/4 the particular r(z) source
still has its certified spectral solve, although the global distinct inverse is singular.
The displayed rational inverse formula evaluates to zero there under totalized inversion
and is NOT a matrix inverse.
Every repeated b=0 source in the range at t=1 has component sum0; every distinct source
in the range at t=1/4 obeys r0-r1-r2=0. Native t=1/101 satisfies the original inverse guards.
See [finding182](findings/182-native-singular-strata-and-source-range-tests.md).
