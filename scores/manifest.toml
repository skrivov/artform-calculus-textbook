**GAC:source-contact-jets (complete polynomial source jets and contact terms).** In the finite boundary
amplitude sum_(x,y) psi(x)*mu(x)*a(x,y)*nu(y)*phi(y), let every factor be a polynomial over Q in one
source parameter. Under fixed finite bijections of the boundary sets, transform all five factors and
kernel arguments. Every formal derivative jet J_n(p,z)=(derivative^n p)(z) of the closed amplitude is
unchanged. In particular J_2(p*q)=J_2(p)*J_0(q)+2*J_1(p)*J_1(q)+J_0(p)*J_2(q), at every rational z.
For the approved native stationary connection block, the polynomials -2*z^2/103 and4*z^2/10403 equal
the complete and connection-only prepared densities respectively. Their second input derivatives are
-4/103 and8/10403, with difference -4/101. The input-dependent contact term must be retained.
The native z is its specified block input, not a verified class of external quantum-gravity sources.
Agreement of finitely many jets at one point does not imply equality of generating polynomials.
See [finding 123](findings/123-polynomial-source-jets-and-native-contact-term.md).
"""
