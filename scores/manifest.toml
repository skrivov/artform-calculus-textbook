[[statement]]
key = "GAC:singular-action"
label = "GAC:singular-action"
title = "Singular quadratic action, constraints and relational gluing"
source = "ALGEBRA-OF-SCORES.md section 7 (GAC:singular-action)"
statement = """
**GAC:singular-action (singular quadratic action and variational gluing).** For rational configurations
x=(x_1,x_2), y=(y_1,y_2), let L(x,y)=(y_1-x_1)^2/2 and pre/post momenta both(y_1-x_1,0).
For all rational epsilon and variations dx,dy, the exact action change is
 epsilon*(-p_pre dot dx+p_post dot dy)+epsilon^2*(dy_1-dx_1)^2/2.
The phase evolution relation p=p_pre(x,y),q=p_post(x,y) is equivalent to
p_2=q_2=0, q_1=p_1 and y_1=x_1+p_1. It leaves y_2 free.
At an intermediate configuration y, equality of the post and pre boundary covectors against every
variation is equivalent to x_1-2*y_1+z_1=0. The exact two-step action change under y+epsilon*d is
 epsilon*(2*y_1-x_1-z_1)*d_1+epsilon^2*d_1^2.
There exist intermediate and endpoint momenta realizing both phase relations exactly when that corner
stationarity holds. This is a singular finite variational model, not an assumed native Dirac reduction.
See [finding 126](findings/126-singular-quadratic-action-constraints-and-gluing.md).
"""
