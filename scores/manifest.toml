title = "Curvature-only elimination fails the original signed force"
source = "ALGEBRA-OF-SCORES.md section 8 (GAC2:curvature-only-force-residual)"
statement = """
**GAC2:curvature-only-force-residual (test the original equation and full density).** Keep
r(z)=(0,-z,z) and B_t of GAC2:signed-block-polynomial-inverse. Then C*r=-r and
B_t*r=-(1+2*t)*r. The curvature-only preparation c_C=2*t*r solves C*c_C+2*t*r=0,
but its ORIGINAL full residual B_t*c_C+2*t*r is-4*t^2*r. If1+2*t!=0, the full
preparation c_B=2*t*r/(1+2*t) solves the original equation. At t=1/101 it is exactly
connectionPreparation(z); c_C is stationary for the native block exactly when z=0.
For the complete source-dependent density S_t=-2*t*z^2+c.B_t*c/2+2*t*c.r,
S_t(c_B)=-2*t*z^2/(1+2*t), while S_t(c_C)-S_t(c_B)=-16*t^4*z^2/(1+2*t).
This indefinite stationary-action difference is not physical energy or a minimum claim.
See [finding163](findings/163-curvature-only-connection-full-force-error.md).
"""
