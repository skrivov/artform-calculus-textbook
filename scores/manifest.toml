At ct=2,cs=1, R0=19/10,R1=34/15 and A(k)>=1.
The representatives with bit_i(k)=0 give exactly eight disjoint pairs(k,k xor2^i), and
sum_representatives1/(A(k)*A(k xor2^i))=R_i/2 at these declared coefficients.
This is a finite Euclidean background-field regulator and a homogeneous quadratic symmetry class,
not a native Lorentz symmetry, a continuum limiting-speed theorem or a full joint matter measure.
