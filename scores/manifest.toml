[[statement]]
key = "GAC2:temporal-forcing-factor-cancellation"
label = "GAC2:temporal-forcing-factor-cancellation"
title = "The original lower temporal forcing through repeated-factor cancellation"
source = "ALGEBRA-OF-SCORES.md section 8 (GAC2:temporal-forcing-factor-cancellation)"
statement = """
**GAC2:temporal-forcing-factor-cancellation (retain the reviewed coefficient normalization).**
Let H(t)=1/[(1+2t)(1-t)], C=t^2*R^2*L/[4(1+2t)(1-t)] and G=t*R*H(t)/2.
If t,R,1+2t,1-t are nonzero, -C/G=-t*R*L/2. At the ORIGINAL kappa and TT witness,
H=10201/10300, C=-63/12875 and-C/G=36/505, exactly the older lower temporalSymbol.
This is the guarded cancellation of the supplied reviewed force/principal coefficients;
it does not derive those coefficients anew from the full40 operator or prove a new native flow.
See [finding184](findings/184-original-temporal-tt-forcing-factor-cancellation.md).
"""
