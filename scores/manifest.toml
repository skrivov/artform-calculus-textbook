label = "GAC2:native-cut-gauge-readouts"
title = "Six-component native cut gauge readouts and their forward frame cost"
source = "ALGEBRA-OF-SCORES.md section 8 (GAC2:native-cut-gauge-readouts)"
statement = """
**GAC2:native-cut-gauge-readouts (actual gauge column, local real-space cut).** On R times
an additive spatial group, take the ORIGINAL native column R Gamma=(lie Gamma,D Gamma)
with time step h!=0, three declared spatial steps and Gamma(t,x)=g_h,1(t)*c(x), using the
bounded profile above. At the cut its coframe value and actual componentwise first time
derivative are0, its temporal native link value is c(x), and its three spatial link values are0.
Its metric variation is0 at every spacetime point. At the forward point its coframe is
lie(c(x)); requiring that frame to remain0 forces c(x)=0. These are local gauge readouts,
not an extension of periodic full-force stationarity or a funded native boundary/history theorem.
See [finding181](findings/181-six-component-native-cut-gauge-readouts.md).
"""
