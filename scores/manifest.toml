key = "GAC:source-response"
label = "GAC:source-response"
title = "Declared impulse responses and a separating experiment"
source = "ALGEBRA-OF-SCORES.md section 7 (GAC:source-response)"
statement = """
**GAC:source-response (declared impulse responses and a separating experiment).** Let K be a semiring
and X,Y,J be K-modules with additive commutative monoids. For linear evolution T, input B:J to X and
output O:X to Y, put H_n(j)=O*T^n*B(j). If x_0=0 and x_(n+1)=T*x_n+B*u_n, then
O*x_n=sum_(j<n) H_(n-1-j)(u_j). For two such models, possibly with different state spaces but the same
input/output modules, equality of every H_n is equivalent to equality of every finite zero-state response
to every input sequence. The input/output class is part of this assertion.
The rational move score (x,z) maps to (x+z,z) and the identity have the same characteristic polynomial,
and both fix every prepared (x,0) for all times. For the same auxiliary input B(j)=(0,j) and visible
output O(x,z)=x, their lag-one unit-impulse responses are 1 and 0 respectively.
Neither equal dispersion nor those selected free readings imply this declared source equivalence.
No native physical input/output class is inferred from this example. See
[finding 116](findings/116-source-response-and-equal-spectrum-counterexample.md).
"""
