For d = 1, c = 2, and R = F_p, Z/p^k or Z/n: E_2(S) = SL_2(S), on the stencil ring S = R[x^±1]. Euclid's algorithm with the width writes every law of determinant 1 as a score. The Lean form is the case of a field, which includes F_p: over every field F, every A in SL(2, F[x, 1/x]) is the law of a score. Z/p^k and Z/n are the entries T1:prime-power and T1:modulus."""
lean_statement = "Artform.Scores.Statement.everyLawIsAScore"
lean_proof = "Artform.Scores.everyLawIsAScore"
