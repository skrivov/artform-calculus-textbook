[[statement]]
key = "R6"
label = "R6"
title = "Blocking"
source = "ALGEBRA-OF-SCORES.md §3 (R6) and §1, Definition 3"
statement = """
(R6) Blocking commutes with the realizer: [[B(w)]] = B([[w]]). Blocking by a sublattice of index m reads the artform A = (Λ, c, R) as B(A) = (Λ′, mc, R): a state of A as a state with mc channels per cell of Λ′. The Lean form: when the stencil ring S is a free module over S′ on a basis of m places, the blocking B (entry by entry, the matrix of multiplication by a stencil) of the law of every two-channel score w is the law of the blocked score B(w). In B(w) each step is replaced by its placed steps, the shears between the 2m channels."""
lean_statement = "Artform.Scores.Statement.blocking"
lean_proof = "Artform.Scores.blocking"
reviewed = ""
review_text_sha256 = ""

[[statement]]
key = "R6:red-black"
label = "R6"
title = "Red-black on the blocked artform"
source = "ALGEBRA-OF-SCORES.md §1, Definition 3; finding 044 (places and red-black)"
statement = """
Red-black on Z^2 blocks by the checkerboard sublattice, of index 2, so 2c channels, and on B(A) the placed step is translation-invariant (Definition 3). Places are invisible inside one step, K_red K_black = K, and red-black, K_red M½ K_black M½, has period 2 (finding 044). The Lean form, for every index-2 blocking with the places red (the basis vector 1) and black (x, with x^2 = d a unit): the red and black kicks together are the blocked kick; the blocked shift by x turns the red-black tick into the black-red tick; and the red-black tick is the blocking of a law of the artform only if κ^2 β = 0, where β is the black part of the move's stencil."""
lean_statement = "Artform.Scores.Statement.redBlack"
lean_proof = "Artform.Scores.redBlack"
reviewed = ""
review_text_sha256 = ""

[[statement]]
key = "T1:field"
label = "T1"
title = "One dimension, every dial"
source = "ALGEBRA-OF-SCORES.md §4.1 (T1)"
statement = """
For d = 1, c = 2, and R = F_p, Z/p^k or Z/n: E_2(S) = SL_2(S), on the stencil ring S = R[x^±1]. Euclid's algorithm with the width writes every law of determinant 1 as a score. The Lean form is the case of a field, which includes F_p: over every field F, every A in SL(2, F[x, 1/x]) is the law of a score. Z/p^k and Z/n are the entries T1:prime-power and T1:modulus."""
lean_statement = "Artform.Scores.Statement.everyLawIsAScore"
lean_proof = "Artform.Scores.everyLawIsAScore"
reviewed = ""
review_text_sha256 = ""

[[statement]]
key = "T1:prime-power"
label = "T1"
title = "One dimension, the dials Z/p^k"
source = "ALGEBRA-OF-SCORES.md §4.1 (T1)"
statement = """
For d = 1, c = 2, and R = F_p, Z/p^k or Z/n: E_2(S) = SL_2(S), on the stencil ring S = R[x^±1]. Lifting from F_p to Z/p^k uses R = K(m) diag(u, 1/u) M(v). The Lean form is the case R = Z/p^k: for every prime p and every k, every A in SL(2, (Z/p^k)[x, 1/x]) is the law of a score. (k = 0 gives the zero ring Z/1.)"""
lean_statement = "Artform.Scores.Statement.everyLawIsAScorePrimePower"
lean_proof = "Artform.Scores.everyLawIsAScorePrimePower"
reviewed = ""
review_text_sha256 = ""

[[statement]]
key = "T1:modulus"
label = "T1"
title = "One dimension, every dial Z/n"
source = "ALGEBRA-OF-SCORES.md §4.1 (T1)"
statement = """
For d = 1, c = 2, and R = F_p, Z/p^k or Z/n: E_2(S) = SL_2(S), on the stencil ring S = R[x^±1], and the Chinese remainder theorem covers Z/n. The Lean form is the case R = Z/n: for every n >= 1, every A in SL(2, (Z/n)[x, 1/x]) is the law of a score. The hypothesis n ≠ 0 leaves out Mathlib's ZMod 0, which is the integers and not a dial."""
lean_statement = "Artform.Scores.Statement.everyLawIsAScoreModulus"
lean_proof = "Artform.Scores.everyLawIsAScoreModulus"
