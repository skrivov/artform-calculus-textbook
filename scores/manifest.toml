**GAC2:source-dependent-action-reconstruction (retain the eliminated source constant).**
Over a characteristic-zero field, let A,B,D be bilinear forms on V,VxW,W, with D symmetric,
and E the declared inverse from W dual to W. For linear sources u,v, set
S(f,a)=A(f,f)/2+B(f,a)+D(a,a)/2-u(f)-v(a), a*=E(v-B(f,-)).
Under D*E=Id, S(f,a)=Seff(f)+D(a-a*,a-a*)/2, where
Seff=A(f,f)/2-u(f)-(v-Bf)(E(v-Bf))/2.
It expands to(A(f,f)-Bf(E(Bf)))/2-(u(f)-Bf(Ev))-v(Ev)/2.
Under BOTH inverse identities, the original auxiliary equation Bf+D a=v holds exactly iff
a=a*, and S(f,a*)=Seff. The nonzero-source rational example has A=3,B=1,D=2,
E=1/2,u=4,v=5,f=1,a*=2 and S=Seff=-13/2. No positivity or native invertibility is assumed.
See [finding171](findings/171-source-dependent-action-and-exact-return.md).
"""
