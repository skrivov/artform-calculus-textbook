gamma=(1/sqrt(2))*sum_(x=0,1) i^(x^2)=(1+i)/sqrt(2), normSq(gamma)=1 and gamma is not1.
Against a fixed coherent reference, normSq(1+gamma)=2+sqrt(2), which is not4.
This is a finite binary quadratic-phase pilot with its explicit Weyl correspondence. It is not
an asserted bosonic metaplectic lift or a native gravity amplitude construction.
