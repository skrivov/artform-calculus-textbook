[[statement]]
key = "T15:rankin"
label = "T15"
title = "Rankin's parity"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); finding 043, Lemma 1 (Rankin 1948, Swan 1999)"
statement = """
An extent of a group G under two steps A and B is a score whose run x → Ax or x → Bx visits every element of G once and comes back: a Hamiltonian cycle of the Cayley digraph. Finding 043, Lemma 1: write c = A^-1 B. In a Hamiltonian cycle the choice of A or B is the same on each coset ⟨c⟩x, because each vertex must have exactly one predecessor. So the cycles are the maps σ_S, for S a set of cosets taking B, and σ_S = σ_∅ ∘ ∏_(C∈S) ρ_C, with ρ_C a cycle of length ord(c). Hence sign σ_S = sign σ_∅ · (sign ρ)^|S|, and an extent needs this sign to equal that of a |G|-cycle, (-1)^(|G|-1). The Lean form holds for every finite group G and every permutation σ of G with σ(x) ∈ {Ax, Bx}. The choice at c^-1 w is the choice at w. For some m, m · ord(c) elements take B (σ(x) ≠ Ax), and sign σ = sign(L_A) · ((-1)^(ord c + 1))^m, where L_A = σ_∅ is left multiplication by A. If σ is moreover an extent (its powers carry any element to any other), then sign σ = (-1)^(|G| + 1)."""
lean_statement = "Artform.Scores.Statement.rankinParity"
lean_proof = "Artform.Scores.rankinParity"
reviewed = "2026-10-30"
review_text_sha256 = "1f84528bee71ad1f58c521bf29d0f8dd3e96cec66ef23e7ce5d39b462cb53912"

[[statement]]
key = "T15:lifting"
label = "T15"
title = "The lifting lemma"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); finding 043, Lemma 2"
statement = """
Finding 043, Lemma 2: if a normal subgroup N lies in ⟨c⟩, c = A^-1 B, every extent of G maps to an extent of G/N. The choice is constant on ⟨c⟩x ⊇ Nx, so σ(nx) = g_x n x ∈ σ(x)N, and σ carries fibres onto fibres; it therefore induces a permutation σ̄ of G/N, and σ̄ is one cycle, since σ is. The Lean form holds for every finite group G and normal subgroup N ≤ ⟨A^-1 B⟩: for every extent σ of G under A and B there is an extent σ' of G/N under the images of A and B with σ'(xN) = σ(x)N for every x."""
lean_statement = "Artform.Scores.Statement.extentLifting"
lean_proof = "Artform.Scores.extentLifting"
reviewed = "2026-10-30"
review_text_sha256 = "6e64d8c21e10fa790b158f3f9bcc20a1b25bac6c234039fd17ff9f22c798134b"

[[statement]]
key = "T15:fibonacci"
label = "T15"
title = "The Fibonacci rule"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); finding 043, Theorem S5.3, part 2"
statement = """
Finding 043, Theorem S5.3, part 2 (the Fibonacci rule): for a prime p ≥ 5, a forward extent of PSL(2,p) or SL(2,p) over (K, M) needs 4 | α(p), where α(p) is the Fibonacci rank of apparition, the least k with p | F_k. Here K = [[1,0],[1,1]] and M = [[1,-1],[0,1]] are the steps of the one-mode leapfrog at μ = 1. The proof: c = K^-1 M has c^k = [[F_(2k-1), -F_(2k)], [-F_(2k), F_(2k+1)]], so c^k = ±I exactly when p | F_(2k), and the order of c in PSL(2,p) is k₀ = α/gcd(α, 2). σ_∅ is even, since K has the odd order p, so parity needs k₀ even, that is 4 | α. In SL(2,p), Lemma 2 reduces the case c^(k₀) = -I to PSL(2,p), and otherwise c has the order k₀. The Lean form holds for every odd prime p (p = 3 included, where α(3) = 4), with K = K(1) and M = M(-1) among the library's steps, and PSL(2,p) = SL(2,p)/center, Mathlib's Matrix.ProjectiveSpecialLinearGroup. Part 1 and Lemma 3 of finding 043 are T15:cat-map and T15:back-step; the table of part 3 and Theorem S5.4 are not in Lean."""
lean_statement = "Artform.Scores.Statement.fibonacciRule"
lean_proof = "Artform.Scores.fibonacciRule"
reviewed = "2026-10-30"
review_text_sha256 = "7de24d7afb707c3934aee9b37457bdba0c9ceadefe4014bb3be4b364004d6141"

[[statement]]
key = "T15:back-step"
label = "T15"
title = "One back-step"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); finding 043, Lemma 3"
statement = """
Finding 043, Lemma 3: suppose a Hamiltonian cycle uses forward steps A, B everywhere except one backward step A^-1 or B^-1. Then AB or BA lies in ⟨c⟩, c = A^-1 B. The proof places the defect at the identity by right multiplication; Rankin's links then join the forward predecessors x = B^-1 h and cx = A^-1 h of every other vertex h; the links break at h = A^-1 (A^-2 takes B and B^-1 A^-1 takes A) and at h = A and h = B (c^-1 takes B and c takes A); within the coset ⟨c⟩ the choices run from c (A) to c^-1 (B) along unbroken links, which is impossible unless the third broken link lies in ⟨c⟩, that is unless (AB)^-1 ∈ ⟨c⟩. The back-step B^-1 gives BA ∈ ⟨c⟩ in the same way. The Lean form holds for every finite group G and every permutation σ of G (not only a Hamiltonian cycle) that steps forward, σ(x) ∈ {Ax, Bx}, at every element but one, x_0: if σ(x_0) = A^-1 x_0 then AB ∈ ⟨A^-1 B⟩, and if σ(x_0) = B^-1 x_0 then BA ∈ ⟨A^-1 B⟩. The defect stays at x_0, so the links run along the coset ⟨c⟩x_0."""
lean_statement = "Artform.Scores.Statement.oneBackStep"
lean_proof = "Artform.Scores.oneBackStep"
reviewed = "2026-10-30"
review_text_sha256 = "aef444b017f07b5d9ff03ad4d0d53c7872f304b795956eaae992863d95ba03b7"

[[statement]]
key = "T15:cat-map"
label = "T15"
title = "Kicks with back-moves never ring"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); finding 043, Theorem S5.3, part 1"
statement = """
Finding 043, Theorem S5.3, part 1: for every n ≥ 3, the score of forward kicks and backward moves (K, M^-1) has no extent of PSL(2,Z/n) or of SL(2,Z/n). Its staggered tick M^-1 K = [[2,1],[1,1]] is Arnold's cat map. The proof: for PSL, c̄ = K̄^-1 M̄^-1 is the inverse of the tick T̄ = M̄K̄, of order 3, so every ρ_C is even; σ̄_∅ is left multiplication by K̄, of order n, a product of |PSL|/n cycles of length n, and |PSL|/n is even for every n ≥ 3, so σ̄_∅ is even; a |PSL|-cycle is odd, so Lemma 1 excludes an extent. For SL, -I = T^3 is a power of c = T^-1, so Lemma 2 maps an extent of SL onto one of PSL. PSL(2,Z/n) is SL(2,Z/n)/{±I}, as in the ledger's code. The Lean form holds for every n ≥ 3, with K = K(1) and M^-1 = M(1) among the library's steps (the leapfrog's move at μ = 1 is M = M(-1)), and PSL(2,Z/n) = SL(2,Z/n)/{±1}. Lean proves the evenness of |PSL|/n = [PSL : ⟨K̄⟩] without the order of PSL(2,Z/n): for even n, the quarter turn S̄ acts on the cosets of ⟨K̄⟩ without fixed points, since a conjugate of S has trace 0 and a power of K the trace ±2."""
lean_statement = "Artform.Scores.Statement.catMapNeverRings"
lean_proof = "Artform.Scores.catMapNeverRings"
reviewed = "2026-10-30"
review_text_sha256 = "57d978e2489977ac7ac67755a5456cbacd9ffe4b2e2f69929a75876e3e18cb7e"

[[statement]]
key = "T15:balance"
label = "T15"
title = "The balance of back-steps"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); finding 043, Lemma 3 and Theorem S5.4, part 3"
statement = """
New in Lean, and the general form of finding 043's Lemma 3 and of its count of the placements of a second back-step. Let σ be any permutation of a finite group, A ≠ B and c = A^-1 B. A back-step is an element that σ moves by neither A nor B. Each y = Bv has one predecessor: cv by A, v by B, or a back-step. Summing over a union O of cosets ⟨c⟩x, the back-steps in O are as many as the v ∈ O such that Bv is the target of a back-step. Lemma 3 is the case of one back-step: its offset B^-1 σ(x) x^-1, which is B^-1 A^-1 or B^-1 B^-1, must lie in ⟨c⟩. With two back-steps, either an offset lies in ⟨c⟩, or g_0 m g_1 ∈ ⟨c⟩ for offsets g_0, g_1 and some m ∈ ⟨c⟩. This matches the ledger's solver: the placements it finds consistent are 4 on PSL(2,Z/4) and SL(2,Z/4), 4 on PSL(2,5) and 8 on SL(2,5), 12 and 24 on Z/10, 4 and 8 on Z/13, and none on Z/8 and Z/11."""
lean_statement = "Artform.Scores.Statement.backStepBalance"
lean_proof = "Artform.Scores.backStepBalance"
