ALGEBRA-OF-SCORES.md, T16: a finite artform with steps (phrases), a score (the cue row) and a stochastic realizer (the caller). One cue read by both dancers keeps the phrase legal. The book, in 06-controller: give each dancer a coin that says orbit with probability 1/4; the two coins disagree with probability 2 · 1/4 · 3/4 = 3/8. The called law gives each dancer the same probability of orbit, but it is not the product of the two: both orbit with probability 1/4, not 1/16, and they never disagree. Two choices can agree every time only through a cause they share. The Lean form: the counts among the equally prepared patterns of two cells (the cue, orbit on 11, read by both: no disagreement, and both orbit on 1 of 4) and of two pairs of cells (the coins: disagreement on 6 of 16, and both orbit on 1 of 16); and for any two choices from independent sources that agree on every pair of outcomes, both are constant. The phrase's legality (`def:legal-state`) is the book's and stays in its library."""
