[[statement]]
key = "T13:two-squares"
label = "T13"
title = "The two squares are the projective line over F₅"
source = "ALGEBRA-OF-SCORES.md §4.5 (T13); finding 038, Theorem Y"
statement = """
Finding 038, Theorem Y: label the six corners of the book's two squares by v_k ↦ k − 1 ∈ F₅, with v₀ ↦ ∞. 1. L(x) = 1/(2x + 1) and R(x) = 2x + 3. They generate PGL(2,5) ≅ S₅, of order 120, acting on P¹(F₅). 2. The labelling is forced: it is the only labelling with v₀, v₁, v₂ at ∞, 0, 1. The 120 labellings that make L and R Möbius maps form one PGL(2,5)-orbit. 3. The tick R∘L(x) = x/(2x + 1), the matrix [[1,0],[2,1]]: the one-mode kick of strength 2 on C₅. It fixes v₁, the all-electric point [0:1]. It moves the ring v₀, v₂, v₄, v₃, v₅: v₀ → v₄ → v₅ → v₂ → v₃ → v₀. So the run repeats every five ticks, and v₁ keeps its letter. 4. det L = 3 and det R = 2 are not squares mod 5. Each turn carries the thirty edges of the icosahedron (det ±1) onto the thirty edges of the great icosahedron (det ±2), and back. Products of an even number of turns are rotations, in PSL(2,5) ≅ A₅. The Lean form: P¹(F₅) is Mathlib's `OnePoint (ZMod 5)` with the action of GL(2, F₅), and PGL(2,5) is the image of that action (`rho.range`). The labelling is `corner`. Part 1: the turns act as the matrices [[0,1],[2,1]] and [[2,3],[0,1]]; the subgroup of the corners' permutations that they generate maps onto `rho.range`; its order is 120; it is isomorphic to `Perm (Fin 5)`. Part 2: a labelling c makes both turns Möbius exactly when c = g ∘ corner for some g; there are 120; and v₀, v₁, v₂ at ∞, 0, 1 force c = corner. Part 3 as stated, with the order 5. Part 4: the determinants and their non-squareness; the statement on pairs of states with det ±1 and ±2; a law of square determinant acts as an element of SL(2, F₅); each product of two turns has a square determinant. Not stated: the isomorphism PSL(2,5) ≅ A₅ (the order 60 of PSL(2,5) is T13:platonic); the geometric rotation by 144° (the turn by two notches is T13:turns); the great icosahedron as a solid; the identification of PGL(2,5) with the "exceptional transitive S₅" inside S₆ beyond its being a subgroup of order 120."""
lean_statement = "Artform.Scores.Statement.twoSquaresProjective"
lean_proof = "Artform.Scores.twoSquaresProjective"
reviewed = "2026-10-30"
review_text_sha256 = "6726bb067b3399c825415a570742e6656fbc97e5b133885d1afe909010879462"

