source = "ALGEBRA-OF-SCORES.md section 8 (GAC2:full-coordinate-variational-force)"
statement = """
**GAC2:full-coordinate-variational-force (all periodic coordinate covectors).** In the domain
and complete S2 formula of GAC2:complete-flat-quadratic-variation, pack all fields through
X times the40 original coordinate slots. Let delta_a be the inverse coordinate image of its
unit vector and F(q)_a=B(q,delta_a)+B(delta_a,q). Then for every test p,
B(q,p)+B(p,q)=sum_a F(q)_a*p_a, and F(q)=0 exactly when every such variation vanishes.
There are40*card(X) coordinate rows, with no physical mode count inferred. The force equals
its full coordinate Hessian times the packed field. This Hessian has symmetric transpose,
without a positivity or Hermitian assertion. Its direct
variation retains both curvature cross terms, both ordered-contact polarizations and the
2*kappa torsion term displayed in ForceDefs. For real fields it is the actual derivative at
epsilon=0 of S2(q+epsilon*p), not half that derivative. No finite-boundary, nonlinear full-force,
refoliation or physical R7/R8 equivalence is inferred.
See [finding166](findings/166-full-original-coordinate-force-and-hessian.md).
"""
