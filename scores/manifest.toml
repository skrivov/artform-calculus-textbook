For d = 1, c = 2, and R = F_p, Z/p^k or Z/n: E_2(S) = SL_2(S), on the stencil ring S = R[x^±1]. Lifting from F_p to Z/p^k uses R = K(m) diag(u, 1/u) M(v). The Lean form is the case R = Z/p^k: for every prime p and every k, every A in SL(2, (Z/p^k)[x, 1/x]) is the law of a score. (k = 0 gives the zero ring Z/1.)"""
