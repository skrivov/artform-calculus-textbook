[[statement]]
key = "GAC:finite-gaussian-loop"
label = "GAC:finite-gaussian-loop"
title = "Convergent finite Gaussian loop and controlled response"
source = "ALGEBRA-OF-SCORES.md section 7 (GAC:finite-gaussian-loop)"
statement = """
**GAC:finite-gaussian-loop (actual finite Gaussian response and remainder).** For real A,B,s
with B>0 and A*B-s^2>0, f(u,v)=exp(-(A*u^2+2*s*u*v+B*v^2)/2) is integrable on R^2.
Its integral is sqrt(pi/c)*sqrt(pi/(B/2)), c=A/2-(s/2)^2/(B/2).
If also A>0, log(Z_s/Z_0)=-log(1-s^2/(A*B))/2.
For every finite family of positive blocks with positive determinants, the product density is
integrable on the actual finite product space, its integral is the product of these factors and
log of its normalized partition is-sum log(1-s^2/(A_i*B_i))/2.
For w_i>=1 and 0<=theta<=1/2, put F(theta)=sum_i log(1-theta/w_i)/2. Then
