[[statement]]
key = "T15:methods"
label = "T15"
title = "Every method is light"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); finding 042, Theorem S5.2"
statement = """
Finding 042, Theorem S5.2: for any sequence of changes, the painted rows obey u(t+1) + u(t-1) = S_t u(t), with S_t = P_t + P_(t-1). This is the book's 1D tick with a neighbour sum that the score sets change by change. S_t cuts the row into intervals of two kinds: mirror boxes [a, b], on which S_t is S_mirror of the box, whose end cells make a place in one of the two changes, so that a place made is a mirror; and dodges, pairs {p, p+1} swapped by both changes, on which S_t = [[0, 2], [2, 0]], a doubled bond. The Lean form holds for paint in every commutative additive monoid. A change is an involution of the positions that moves each position at most one place. The painted rows (the number on the bell in each position) obey u(t+1) = P_t u(t) and the tick. For two changes A and B and each position i: on a dodge (A i = B i, not i) the sum is the doubled bond u(A i) + u(A i), and B swaps the partner back; elsewhere P_A u + P_B u is the box's neighbour sum, with a wall where neither change swaps, and at a wall a place is made. Lean states the walls, not the list of intervals that they cut. The extents of T15 (finding 043) are the entries T15:rankin, T15:lifting and T15:fibonacci."""
lean_statement = "Artform.Scores.Statement.methodsAreLight"
lean_proof = "Artform.Scores.methodsAreLight"
reviewed = ""
review_text_sha256 = ""

[[statement]]
key = "T15:plain-hunt"
label = "T15"
title = "Plain hunt is light in a mirror box"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); finding 042, Theorem S5.1"
statement = """
Finding 042, Theorem S5.1, for N >= 3: (1) P_X + P_Y = S_mirror. (2) The painted rows of plain hunt obey u(t+1) + u(t-1) = S_mirror u(t), the book's one-dimensional tick at Courant number 1 in a box with mirror walls, for any numbers on the bells. (3) Every bell is a light ray: it moves one place per change, and at each wall it lies for one change and turns back. (4) The plain course has 2N rows. The Lean form proves (1) and (2) for every N, and (3) by explicit positions for every N: after t changes the bell from the position b is at fold(start(b) + t), the point start(b) + t of a circle of 2N places folded onto the box, so it moves one place per change or lies at a wall, and for N >= 2 it never lies twice running. For (4), with N >= 3: the rows after s and t changes are equal exactly when s = t mod 2N. Lean numbers the positions from 0, the ledger from 1."""
lean_statement = "Artform.Scores.Statement.plainHuntIsLight"
lean_proof = "Artform.Scores.plainHuntIsLight"
reviewed = ""
review_text_sha256 = ""

[[statement]]
key = "T15:modes"
label = "T15"
title = "The modes of the mirror box"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); finding 042, Theorem S5.1, part 4"
statement = """
Finding 042, Theorem S5.1, part 4: the plain course has 2N rows. These are the periods of the box's modes: S_mirror has the eigenvalues 2 cos(πk/N), and the tick turns mode k by πk/N. The Lean form, over the reals: the mode v_k(i) = cos(πk(2i + 1)/(2N)) has S_mirror v_k = 2 cos(πk/N) v_k; the N modes 0 <= k < N are linearly independent, and S_mirror has no other eigenvalue; (A cos(πkt/N) + B sin(πkt/N)) v_k obeys the tick u(t+1) + u(t-1) = S_mirror u(t) for all A and B, and 2N changes are a period of every mode."""
lean_statement = "Artform.Scores.Statement.mirrorModes"
lean_proof = "Artform.Scores.mirrorModes"
reviewed = ""
review_text_sha256 = ""

[[statement]]
key = "T15:coxeter"
label = "T15"
title = "The presentation of the bells"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15) and §5 (the row 'bells')"
statement = """
T15: the artform has N positions, its values a permutation. The steps are the changes, products of disjoint adjacent transpositions s_i. The rules are Coxeter's s_i^2 = 1, (s_i s_(i+1))^3 = 1 and (s_i s_j)^2 = 1 for |i - j| >= 2. The semantics is S_N. Known: expressive and complete (Moore 1897). The Lean form, for every N = n + 1: the law of the generator s_i is the swap of the neighbours i and i + 1, and the rules are the relations of Mathlib's Coxeter matrix A_n (CoxeterMatrix.A n). Every permutation is the law of a word (expressive), and two words have the same law exactly when they are equal in the group that the rules present (complete)."""
lean_statement = "Artform.Scores.Statement.bellsPresentation"
lean_proof = "Artform.Scores.bellsPresentation"
reviewed = ""
review_text_sha256 = ""

[[statement]]
key = "T15:rankin"
label = "T15"
title = "Rankin's parity"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); finding 043, Lemma 1 (Rankin 1948, Swan 1999)"
statement = """
An extent of a group G under two steps A and B is a score whose run x → Ax or x → Bx visits every element of G once and comes back: a Hamiltonian cycle of the Cayley digraph. Finding 043, Lemma 1: write c = A^-1 B. In a Hamiltonian cycle the choice of A or B is the same on each coset ⟨c⟩x, because each vertex must have exactly one predecessor. So the cycles are the maps σ_S, for S a set of cosets taking B, and σ_S = σ_∅ ∘ ∏_(C∈S) ρ_C, with ρ_C a cycle of length ord(c). Hence sign σ_S = sign σ_∅ · (sign ρ)^|S|, and an extent needs this sign to equal that of a |G|-cycle, (-1)^(|G|-1). The Lean form holds for every finite group G and every permutation σ of G with σ(x) ∈ {Ax, Bx}. The choice at c^-1 w is the choice at w. For some m, m · ord(c) elements take B (σ(x) ≠ Ax), and sign σ = sign(L_A) · ((-1)^(ord c + 1))^m, where L_A = σ_∅ is left multiplication by A. If σ is moreover an extent (its powers carry any element to any other), then sign σ = (-1)^(|G| + 1)."""
lean_statement = "Artform.Scores.Statement.rankinParity"
lean_proof = "Artform.Scores.rankinParity"
reviewed = ""
review_text_sha256 = ""

[[statement]]
key = "T15:lifting"
label = "T15"
title = "The lifting lemma"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); finding 043, Lemma 2"
statement = """
Finding 043, Lemma 2: if a normal subgroup N lies in ⟨c⟩, c = A^-1 B, every extent of G maps to an extent of G/N. The choice is constant on ⟨c⟩x ⊇ Nx, so σ(nx) = g_x n x ∈ σ(x)N, and σ carries fibres onto fibres; it therefore induces a permutation σ̄ of G/N, and σ̄ is one cycle, since σ is. The Lean form holds for every finite group G and normal subgroup N ≤ ⟨A^-1 B⟩: for every extent σ of G under A and B there is an extent σ' of G/N under the images of A and B with σ'(xN) = σ(x)N for every x."""
lean_statement = "Artform.Scores.Statement.extentLifting"
lean_proof = "Artform.Scores.extentLifting"
reviewed = ""
review_text_sha256 = ""

[[statement]]
key = "T15:fibonacci"
label = "T15"
title = "The Fibonacci rule"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); finding 043, Theorem S5.3, part 2"
statement = """
Finding 043, Theorem S5.3, part 2 (the Fibonacci rule): for a prime p ≥ 5, a forward extent of PSL(2,p) or SL(2,p) over (K, M) needs 4 | α(p), where α(p) is the Fibonacci rank of apparition, the least k with p | F_k. Here K = [[1,0],[1,1]] and M = [[1,-1],[0,1]] are the steps of the one-mode leapfrog at μ = 1. The proof: c = K^-1 M has c^k = [[F_(2k-1), -F_(2k)], [-F_(2k), F_(2k+1)]], so c^k = ±I exactly when p | F_(2k), and the order of c in PSL(2,p) is k₀ = α/gcd(α, 2). σ_∅ is even, since K has the odd order p, so parity needs k₀ even, that is 4 | α. In SL(2,p), Lemma 2 reduces the case c^(k₀) = -I to PSL(2,p), and otherwise c has the order k₀. The Lean form holds for every odd prime p (p = 3 included, where α(3) = 4), with K = K(1) and M = M(-1) among the library's steps, and PSL(2,p) = SL(2,p)/center, Mathlib's Matrix.ProjectiveSpecialLinearGroup. Part 1 and Lemma 3 of finding 043 are T15:cat-map and T15:back-step; the table of part 3 and Theorem S5.4 are not in Lean."""
lean_statement = "Artform.Scores.Statement.fibonacciRule"
lean_proof = "Artform.Scores.fibonacciRule"
