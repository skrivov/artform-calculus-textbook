[[statement]]
key = "T15:cat-map"
label = "T15"
title = "Kicks with back-moves never ring"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); finding 043, Theorem S5.3, part 1"
statement = """
Finding 043, Theorem S5.3, part 1: for every n ≥ 3, the score of forward kicks and backward moves (K, M^-1) has no extent of PSL(2,Z/n) or of SL(2,Z/n). Its staggered tick M^-1 K = [[2,1],[1,1]] is Arnold's cat map. The proof: for PSL, c̄ = K̄^-1 M̄^-1 is the inverse of the tick T̄ = M̄K̄, of order 3, so every ρ_C is even; σ̄_∅ is left multiplication by K̄, of order n, a product of |PSL|/n cycles of length n, and |PSL|/n is even for every n ≥ 3, so σ̄_∅ is even; a |PSL|-cycle is odd, so Lemma 1 excludes an extent. For SL, -I = T^3 is a power of c = T^-1, so Lemma 2 maps an extent of SL onto one of PSL. PSL(2,Z/n) is SL(2,Z/n)/{±I}, as in the ledger's code. The Lean form holds for every n ≥ 3, with K = K(1) and M^-1 = M(1) among the library's steps (the leapfrog's move at μ = 1 is M = M(-1)), and PSL(2,Z/n) = SL(2,Z/n)/{±1}. Lean proves the evenness of |PSL|/n = [PSL : ⟨K̄⟩] without the order of PSL(2,Z/n): for even n, the quarter turn S̄ acts on the cosets of ⟨K̄⟩ without fixed points, since a conjugate of S has trace 0 and a power of K the trace ±2."""
lean_statement = "Artform.Scores.Statement.catMapNeverRings"
lean_proof = "Artform.Scores.catMapNeverRings"
