[[statement]]
key = "GAC2:selected-source-work-audit"
label = "GAC2:selected-source-work-audit"
title = "The actual solved source and a declared one-multiplication lower bound"
source = "ALGEBRA-OF-SCORES.md section 8 (GAC2:selected-source-work-audit)"
statement = """
**GAC2:selected-source-work-audit (matched original source, no claimed overall saving).**
A factorized proof reproduces EXACTLY the older universal rational schurCovector output
(-101*z/103,-101*z/103,0). With its scalar coefficient precomputed, one multiplication
and free copies/negation produce this output. No zero-cost wire consisting only of the input,
its negative or an arbitrary input-independent constant can implement its first coordinate for
all z. The actual older closed form is already optimal in that declared wire model.
Measured local/tree figures improve for a sparse proof, but its full structural dependency
DAG grows18,332->22,302; no overall proof-size, checker-runtime or historical-time saving
is established. Measurements are representation-specific, not serialized certificate bytes.
See [finding183](findings/183-matched-selected-source-proof-and-work-audit.md).
"""
