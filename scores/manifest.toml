source = "ALGEBRA-OF-SCORES.md section 7 (GAC:radical-reduction)"
statement = """
**GAC:radical-reduction (the actual singular-model radical and reduced dynamics).** Represent the
singular action's constraint surface by(q,p,g) maps to((q,g),(p,0)). Its pulled-back phase form is
omega(x,y)=q*p'-p*q'. Its entire radical is N={(0,0,g)}. The quotient by N is linearly equivalent
to Q^2 by[(q,p,g)] maps to(q,p), and the original constrained relation holds exactly when the
outgoing readout is the unit drift(q,p) maps to(q+p,p) of the incoming readout.
The compatible selected step(q,p,g) maps to(q+p,p,g+q) induces that drift under the quotient
equivalence. The readout formula gives the standard nonzero two-variable area pairing, which the
drift preserves. Each declared source j*q factors through the quotient; the source g does not.
These are the actual radical, quotient and source tests of the specified finite singular action.
They do not identify a native gravity radical, physical Hamiltonian or mode count.
See [finding 128](findings/128-singular-action-radical-quotient-and-source-test.md).
"""
