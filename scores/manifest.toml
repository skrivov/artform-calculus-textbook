source = "ALGEBRA-OF-SCORES.md section 7 (GAC:changing-geometry)"
statement = """
**GAC:changing-geometry (edge subdivision and retained detail).** For rational vertex data on one
coarse edge put d_c(u)=u_1-u_0. On the subdivided edge with three vertices put
 d_f(u)=(u_1-u_0,u_2-u_1). Vertex restriction retains(u_0,u_2), while edge aggregation sends(e_0,e_1)
to e_0+e_1. Aggregation*d_f=d_c*restriction. Midpoint refinement sends(a,b) to(a,(a+b)/2,b),
restriction*refinement=id, and its fine gradient is(d_c/2,d_c/2).
Two fine edge fields e,f have the same aggregate exactly when f=e+(d,-d) for some rational d.
The retained-detail map e maps to(e_0+e_1,e_0-e_1) is a linear equivalence with inverse
(c,d) maps to((c+d)/2,(c-d)/2); both recovery identities hold for all data.
Aggregation alone has nontrivial fibres and is not this equivalence. This concerns a concrete change
of finite one-dimensional incidence geometry, with no automatic curved or native gravity transfer.
See [finding 125](findings/125-incidence-compatible-edge-subdivision-and-detail.md).
"""
