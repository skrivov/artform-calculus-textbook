[[statement]]
key = "GAC:canonical-composition"
label = "GAC:canonical-composition"
title = "Canonical composition and a non-clean polynomial test"
source = "ALGEBRA-OF-SCORES.md section 7 (GAC:canonical-composition)"
statement = """
**GAC:canonical-composition (linear composition and a nonlinear intersection test).** Over a field K,
let X,Y,Z be modules with additive commutative groups, Y finite dimensional, and BX,BY,BZ bilinear
forms with BY nondegenerate. Call R in X*Y self-orthogonal when membership(x,y) in R is equivalent to
BX(x,u)=BY(y,v) for every(u,v) in R. The relational composite of two such linear subspaces R in X*Y
and S in Y*Z is self-orthogonal for BX,BZ. This includes finite-dimensional symplectic canonical relations.
The singular-action phase form is alternating and nondegenerate, and its full constrained relation is
self-orthogonal for that form. For the real polynomial parameterization F(t,p)=((t^2,p),(t,2*t*p)),
both F and its linear first variation J_(t,p)(dt,dp)=((2*t*dt,dp),(dt,2*p*dt+2*t*dp)) are injective.
J is isotropic for minus the incoming plus the outgoing area form. For every real epsilon the exact
variation is F(a+epsilon*u)=F(a)+epsilon*J_a(u)+epsilon^2*((u_t^2,0),(0,2*u_t*u_p)).
Composing its image relation with the incoming vertical fibre y_q=0 yields exactly the outgoing zero
point. At t=0 the variation u=(1,0) satisfies the linearized incoming constraint and has outgoing
delta q=1, while no nonzero step along that parameter direction satisfies the exact constraint.
This checks a concrete failure of unqualified nonlinear linearization, not a general nonlinear theorem.
See [finding 127](findings/127-canonical-linear-composition-and-nonlinear-intersection.md).
"""
lean_statement = "Artform.Scores.GravityBridge.Statement.canonicalLaw"
lean_proof = "Artform.Scores.GravityBridge.canonicalLaw"
reviewed = "2026-10-30"
review_text_sha256 = "824e5b4646d5277ed82cdcbd4fd8a5b2e359c83c017192453ae83d6db79077be"

