[[statement]]
key = "T13:turns"
label = "T13"
title = "The steps are turns"
source = "ALGEBRA-OF-SCORES.md §4.5 (T13); finding 038, Theorem U, parts 2 and 3"
statement = """
Finding 038, Theorem U, part 2: the kick fixes E and turns its link [1:e] ↦ [1:e+κ] by κ notches. The move fixes B and turns its link [b:1] ↦ [b−λg:1] by λg notches. E and B are adjacent. Part 3: a kick moves a state (b, e) along an edge exactly when κb² ≡ ±1 (mod n), and a move exactly when λg e² ≡ ±1. Every unit squares to ±1 exactly on the dials 2, 3, 4, 5, 6, 8, 10, 12 and 24. The Lean form holds for every n and every κ, ℓ = λg in Z/n: the kick and the move on these states, det(E, B) = −1, and det(v, Kv) = κb², det(v, Mv) = ℓe², which is what "along an edge" means. For every n ≠ 0, the units of Z/n square to ±1 exactly when n is 1, 2, 3, 4, 5, 6, 8, 10, 12 or 24; the ledger's list starts at 2."""
