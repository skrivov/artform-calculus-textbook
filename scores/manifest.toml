[[statement]]
key = "T14"
label = "T14"
title = "The caller's cut"
source = "ALGEBRA-OF-SCORES.md §4.6 (T14); finding 080, Theorems S8.4-S8.5"
statement = """
The two orders of the dimension split have the same phase and the cuts +-h^2(g_x - g_y)/2; a caller with weights q, 1 - q has a mean tick with the cut (2q - 1) h^2 (g_x - g_y)/2, which cancels exactly for a fair caller (q = 1/2); the book's caller (turn on 11, q = 1/4) leaves -h^2 (g_x - g_y)/4. Over every field of characteristic zero."""
lean_statement = "Artform.Scores.Statement.callerCut"
lean_proof = "Artform.Scores.callerCut"
reviewed = ""
review_text_sha256 = ""
