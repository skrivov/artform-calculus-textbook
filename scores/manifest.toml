title = "The modes of the mirror box"
source = "ALGEBRA-OF-SCORES.md §4.7 (T15); finding 042, Theorem S5.1, part 4"
statement = """
Finding 042, Theorem S5.1, part 4: the plain course has 2N rows. These are the periods of the box's modes: S_mirror has the eigenvalues 2 cos(πk/N), and the tick turns mode k by πk/N. The Lean form, over the reals: the mode v_k(i) = cos(πk(2i + 1)/(2N)) has S_mirror v_k = 2 cos(πk/N) v_k; the N modes 0 <= k < N are linearly independent, and S_mirror has no other eigenvalue; (A cos(πkt/N) + B sin(πkt/N)) v_k obeys the tick u(t+1) + u(t-1) = S_mirror u(t) for all A and B, and 2N changes are a period of every mode."""
