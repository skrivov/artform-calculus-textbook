source = "ALGEBRA-OF-SCORES.md section 7 (GAC:companion-readout)"
statement = """
**GAC:companion-readout (triangular companion readout and full-state invariance).** Let K be a
commutative ring, Y,Z be K-modules with additive commutative groups, r in K, F:Y^2 to Z linear and
D:Z^4 to Z linear. Put O_r(q,v)=(v,-r*q) and
L(y,z)=(O_r(y),(z_1,z_2,z_3,F(y)+D(z))). For every natural n and every y,z,
the Y^2 head of L^n(y,z) is O_r^n(y), independently of all initial auxiliary jets.
The zero-auxiliary graph is preserved with that head map if and only if F(y)=0 for every y.
Thus closed selected readings and full-image invariance are different properties even in a linear
companion system. These are operator powers, not an identification with n native lattice time steps.
The native leading trace interpretation and finite-spacing obligations are stated in
[finding 114](findings/114-native-leading-triangular-readout-and-memory-gap.md).
"""
