[[statement]]
key = "T13:regular-map"
label = "T13"
title = "The regular map of a dial"
source = "ALGEBRA-OF-SCORES.md §4.5 (T13); finding 038, Theorem U, part 1"
statement = """
Finding 038, Theorem U, part 1 (Klein): the vertices V_n are the primitive vectors (b, e) of (Z/n)² up to sign; two vertices are joined when det(u, v) ≡ ±1; the faces are the triangles {u, v, u + v} with det(u, v) = 1. For n ≥ 3 this is a regular map of type {3, n}. PSL(2,Z/n) acts on it by rotations, simply transitively on its directed edges. V = |PSL|/n, E = |PSL|/2 and F = |PSL|/3, so the Euler characteristic is |PSL|(6 − n)/(6n). The Lean form, for every n ≥ 3: a directed edge is a pair of classes [u] → [v] with det(u, v) = 1 for some representatives, and `toDir g` is the pair of classes of the columns of g. Every law gives a directed edge, every directed edge is a law's, and two laws give one directed edge exactly when they are one element of PSL(2,Z/n) = SL(2,Z/n)/{±1}. The counts hold as |PSL| = number of directed edges = V n = 2 E = 3 F; the Euler characteristic as (V − E + F) · 6n = |PSL| (6 − n). A vertex has n neighbours, stated at E (the group is transitive on vertices, `vertices` being one orbit). Three classes pairwise joined form a face, the two faces {u, v, u ± v} on an edge differ, and the action keeps the edges and the faces. A vertex's turn is T13's `stepsAreTurns`."""
