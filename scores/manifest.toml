review_text_sha256 = "ad86ed7bb0bfc496479fd4d69d58d7b53730003c581611a94ddd42c372f67ce8"

[[statement]]
key = "T1:prime-power"
label = "T1"
title = "One dimension, the dials Z/p^k"
