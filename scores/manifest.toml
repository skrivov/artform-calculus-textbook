key = "GAC:reversible-memory"
label = "GAC:reversible-memory"
title = "Reversibility and finite retained information"
source = "ALGEBRA-OF-SCORES.md section 7 (GAC:reversible-memory)"
statement = """
**GAC:reversible-memory (invariant preparation, reset and retained information).** For arbitrary types Y,H,
let E:Y to H and R:H to Y satisfy R*E=id, let T be a bijection of H, and put U=R*T*E.
If T preserves the actual image of E, then U is injective, and T^-1 preserves that image if and only if
U is surjective. If Y is finite, U is bijective. Forward image preservation alone need not give
surjectivity on an infinite Y. For arbitrary X,W, a finite memory type M, readout O:X to W and m:X to M,
if x maps to (O(x),m(x)) injectively, then m restricted to each fibre O^-1(w) is injective and
card(O^-1(w))<=card(M). For a nonempty visible type Y and a fixed z0 in Z, the reset
(y,z) maps to (y,z0) injectively if and only if Z is a subsingleton. This is a finite information bound,
with no thermodynamic energy or continuous native-gravity dimension cost inferred.
See [finding 122](findings/122-reversible-preparation-reset-and-finite-memory.md).
"""
