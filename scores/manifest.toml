From rest the output depends only on (t, a): b_n = [cos n theta + ((a - d)/2) sin n theta / sin theta] b_0, so the pair (t, a) of phase and reading is the complete invariant of the output. The Lean form proves the invariance: two laws with the same phase and reading give the same flux b at every tick from (b, e) = (b_0, 0)."""
