[[statement]]
key = "GAC:refinement-elimination"
label = "GAC:refinement-elimination"
title = "Detail elimination retains source contacts and memory"
source = "ALGEBRA-OF-SCORES.md section 7 (GAC:refinement-elimination)"
statement = """
**GAC:refinement-elimination (detail elimination, source contact and memory).** For rational nonzero
h0,h1,H=h0+h1, set e0=h0*c/H+d, e1=h1*c/H-d and
L=e0^2/(2*h0)+e1^2/(2*h1)-j*d. Then
L=c^2/(2*H)-h0*h1*j^2/(2*H)+H*(d-h0*h1*j/H)^2/(2*h0*h1).
For positive h0,h1 the reduced value is the unique minimum in d, attained at d=h0*h1*j/H.
The two positive step lengths add to H; elimination retains its source-dependent contact term.
Under the reversible original balanced score diag(2,1/2) on fine edges, the retained sum/difference
coordinates(c,d) evolve by((5*c+3*d)/4,(3*c+5*d)/4). The detail equivalence intertwines these laws.
Their visible aggregate satisfies c_(n+2)=(5/2)*c_(n+1)-c_n at every two-step state, while no map
U(c) gives the next aggregate for all c,d. Retaining detail and eliminating/resetting it are different
operations. This is exact finite algebra; no Gaussian integral or native quantum refinement is inferred.
See [finding 129](findings/129-refinement-detail-elimination-contact-and-memory.md).
"""
