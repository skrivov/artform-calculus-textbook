[[statement]]
key = "GAC:r8-angular-conditioning"
label = "GAC:r8-angular-conditioning"
title = "Explicit leading metric-cut angular conditioning"
source = "ALGEBRA-OF-SCORES.md section 7 (GAC:r8-angular-conditioning)"
statement = """
**GAC:r8-angular-conditioning (explicit leading metric-cut angular conditioning).** For real k in R^3,
put r2=sum_i k_i^2, v_i=k_i^2-k_i*(sum_j k_j^3)/r2, F=sum_i k_i^4-(sum_i k_i^3)^2/r2.
For r2 nonzero, sum_i v_i^2=F and r2*F=sum_(i<j) [k_i*k_j*(k_i-k_j)]^2.
For every r2>0 there are m nonzero and a nonempty Boolean coordinate mask b such that, with
w_i=m when b_i is true and zero otherwise, r2*sum_i(k_i-w_i)^2<=36*F.
If delta>0 and every such exceptional-line point w has sum_i(k_i-w_i)^2>=delta^2,
then r2*delta^2<=36*F. For the literal rational native coefficient C_* of M185 equations2–3,
C_*>1/(24*101). The leading scalar d4=-C_*F is nonzero and its reciprocal has absolute value
at most87264/(r2*delta^2). This is a pointwise leading-symbol estimate; no finite-h remainder,
full40 extraction or physical energy interpretation is supplied by this bound.
See [finding 117](findings/117-native-leading-metric-cut-angular-conditioning.md).
"""
