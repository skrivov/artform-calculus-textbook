label = "GAC:quotient-compatibility"
title = "Evolution, source and boundary-form quotient compatibility"
source = "ALGEBRA-OF-SCORES.md section 7 (GAC:quotient-compatibility)"
statement = """
**GAC:quotient-compatibility (evolution, sources and boundary forms).** Let K be a field, X,W be
K-modules with additive commutative groups and N a submodule of X. A linear endomorphism T descends
to X/N exactly when T(N) is contained in N. A linear output O:X to W factors through X/N exactly
when O(N)=0. For any declared family of source covectors S_j:X to K, each factors through X/N
exactly when each annihilates N. A bilinear boundary form omega on X descends in both arguments
exactly when omega(n,x)=omega(x,n)=0 for every n in N and x in X.
If T preserves N, every fixed affine source translation x maps to T(x)+b respects quotient classes,
for arbitrary b in X; it is not necessary that b belong to N. These conditions construct the quotient
maps and form. A direction ignored by one selected readout need not be a boundary-form radical.
No native physical radical or native source class is assumed to satisfy these criteria.
See [finding 124](findings/124-compatible-quotients-for-evolution-sources-and-forms.md).
"""
