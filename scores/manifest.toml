Finding 043, Theorem S5.4, part 1: the two squares. Their extents need exactly two back-turns. None has forward turns only, by Lemma 1: ord(L^-1 R) = 3, and every σ_S is even. None has one back-turn, by Lemma 3: ⟨L^-1 R⟩ has order 3, while LR and RL have order 5. There is one with two back-turns. The Lean form: L = (v_0 v_1 v_2 v_3) and R = (v_1 v_4 v_5 v_2) are the book's turns on the six corners (finding 038, Theorem Y); the group is the subgroup of the permutations of the corners that they generate, of order 120; the orders of L^-1 R, LR and RL are 3, 5 and 5; and the fewest back-steps of a run of that group under L and R is two (`FewestBack`). A run is a permutation through all of the group with steps x → Lx, Rx, L^-1 x or R^-1 x, and a back-step is an element that it moves by neither L nor R. The run with two back-turns is a certificate (`scripts/extent_certificates.py`), checked by the kernel."""
