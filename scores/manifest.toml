[[statement]]
key = "GAC:schedule-boundary"
label = "GAC:schedule-boundary"
title = "Shear schedule defect and exact endpoint primitives"
source = "ALGEBRA-OF-SCORES.md section 7 (GAC:schedule-boundary)"
statement = """
**GAC:schedule-boundary (shear order and endpoint terms).** For rational a,b define
K_a(q,p)=(q,p+a*q), M_b(q,p)=(q+b*p,p). Then
M_b*K_a(x)-K_a*M_b(x)=(a*b*q,-a*b*p); the two complete laws agree for every x exactly when a*b=0.
Both orders preserve q*p'-p*q'. With theta_x(u)=p*u_q their endpoint-potential differences are
D F_KM(x)[u] and D F_MK(x)[u], where
F_KM=a*q^2/2+b*(p+a*q)^2/2 and F_MK=b*p^2/2+a*(q+b*p)^2/2.
Each displayed D is its exact linear variation coefficient, and
F(x+epsilon*u)=F(x)+epsilon*D F(x)[u]+epsilon^2*F(u).
For any field K, module X, submodule N and linear F,G,
mkQ*F=mkQ*G exactly when range(F-G) is contained in N. For already compatible quotient laws this
is the required equality test. Symplecticity alone neither erases the order defect nor drops boundary
primitives. No native gravitational schedule equivalence is asserted.
See [finding 130](findings/130-shear-schedule-defects-and-endpoint-primitives.md).
"""
lean_statement = "Artform.Scores.GravityBridge.Statement.scheduleLaw"
