# The statements of the algebra of scores that the library ArtformScores proves,
# one entry each. The source is the research ledger's ALGEBRA-OF-SCORES.md (in
# the author's workspace, physics/ledgers/lattice-waves/); `statement` quotes its
# text, so that a review needs nothing outside this repository.
#
# [[statement]] fields: key, label, title, source, statement, lean_statement,
#   lean_proof, reviewed, review_text_sha256
#
# scripts/ledger_status.py --approve fills in the review fields. An approval
# stands until a review returns the statement; its hash records what was
# reviewed (scripts/ledger_status.py --drift). Everything else is edited by hand.

[[statement]]
key = "R1"
label = "R1"
title = "Merging"
source = "ALGEBRA-OF-SCORES.md §3 (R1)"
statement = """
e_ij(f) e_ij(g) = e_ij(f + g): two kicks in a row are one kick with the summed stencil, and two moves in a row are one move. Over every commutative ring S."""
lean_statement = "Artform.Scores.Statement.merging"
lean_proof = "Artform.Scores.merging"
reviewed = ""
review_text_sha256 = ""

[[statement]]
key = "R3"
label = "R3"
title = "Whitehead's rule"
source = "ALGEBRA-OF-SCORES.md §3 (R3)"
statement = """
For a unit u, the Whitehead word w(u) = M(u) K(-u^-1) M(u) has the law [[0, u], [-u^-1, 0]], and w(u) M(f) w(u)^-1 = K(-u^-2 f), w(u) K(f) w(u)^-1 = M(-u^2 f). Over every commutative ring S."""
lean_statement = "Artform.Scores.Statement.whiteheadRule"
lean_proof = "Artform.Scores.whiteheadRule"
reviewed = ""
review_text_sha256 = ""

[[statement]]
key = "R4"
label = "R4"
title = "Balanced movers"
source = "ALGEBRA-OF-SCORES.md §3 (R4)"
statement = """
The balanced pair h(u) = w(u) w(1)^-1 is diag(u, u^-1), and h(u) h(v) = h(uv), for units u, v of every commutative ring S."""
lean_statement = "Artform.Scores.Statement.balancedRule"
lean_proof = "Artform.Scores.balancedRule"
reviewed = ""
review_text_sha256 = ""

[[statement]]
key = "R5"
label = "R5"
title = "Time reversal"
source = "ALGEBRA-OF-SCORES.md §3 (R5)"
statement = """
The anti-automorphism that reverses a score and inverts its letters realizes the inverse law: [[rho(w)]] = [[w]]^-1."""
lean_statement = "Artform.Scores.Statement.timeReversal"
lean_proof = "Artform.Scores.timeReversal"
reviewed = ""
