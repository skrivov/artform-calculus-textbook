**GAC:connection-preparation (native connection preparation and source term).** Use the rational signed
block B and kappa=1/101 of GAC:native-distinct-block. Put r(z)=(0,-z,z), c*(z)=(0,-2*z/103,2*z/103),
L(z,c)=c.B.c/2+2*kappa*c.r(z), and z_ij=-14*q_ij/4 for the polarization q of GAC:temporal-witness.
For every rational z,c, B*c+2*kappa*r(z)=0 if and only if c=c*(z); c=0 solves it if and only if z=0.
