label = "GAC:realization"
title = "Invariance and all-time realization"
source = "ALGEBRA-OF-SCORES.md section 7 (GAC:realization)"
statement = """
**GAC:realization (invariance and all-time realization).** For arbitrary types Y,H, maps E:Y to H, R:H to Y
with R(E(y))=y, and T:H to H, put U=R composed with T composed with E. The image of E is forward invariant
under T if and only if T(E(y))=E(U(y)) for every y. This implies, for every natural n and y,
T^n(E(y))=E(U^n(y)) and R(T^n(E(y)))=U^n(y). No converse from visible readings alone is asserted.
See [finding 102](findings/102-typed-evolution-and-invariant-realization.md), including its counterexample.
"""
