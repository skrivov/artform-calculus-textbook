Finding 037, Theorem Q. The table gives the relations KMK = MKM, (KMK)⁴ = 1 at μ = 1; (MK)⁴ = 1, (MK)²K = K(MK)² at μ = 2; (MK)³ = 1 at μ = 3; and Γ¹(3) ≅ Z ∗ Z₃, Γ¹(4) free. Its part 3: PSL(2,Z) ≅ Z₂ ∗ Z₃ gives the presentation in the table; Γ̄⁰(2) ≅ Z ∗ Z₂ and Γ̄⁰(3) ≅ Z ∗ Z₃; for μ = 3, Σ₃ ≅ ⟨K, T | T³⟩; for μ = 2, Σ₂ is the central extension by ⟨T²⟩ = ⟨−I⟩, presented by ⟨K, T | T⁴, [T², K]⟩. The Lean form: at each of μ = 1, 2, 3, a word in K and M has the identity law exactly when it lies in the normal closure of the table's relations; Γ¹(3) is isomorphic to the free product of Z and Z₃; and Γ¹(4) is isomorphic to the free group on two generators. The proof is a ping-pong on the lines of ℤ², in place of the finding's Hopfian argument."""
