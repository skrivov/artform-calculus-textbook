key = "GAC2:higher-temporal-profile-budget"
label = "GAC2:higher-temporal-profile-budget"
title = "Higher temporal Lorentz jets with explicit real profile bounds"
source = "ALGEBRA-OF-SCORES.md section 8 (GAC2:higher-temporal-profile-budget)"
statement = """
**GAC2:higher-temporal-profile-budget (real interpolation and its declared cost).** For real
h!=0,c, the quadratic profile c*(t/h)^2 has value and derivative0 at t=0 and value c at h.
The bounded real profile g(t)=c*(1+h^2)/h^2*t^2/(1+t^2) has the same three readouts and
satisfies |g(t)|<=|c*(1+h^2)/h^2|. For h>0,c=h^3*a/4 the latter bound is
h*|a|*(1+h^2)/4. A native forward difference can therefore be adjusted by a declared
higher jet while preserving the first cut jet. If both endpoint frame parameters are fixed
zero, a nonzero adjustment is impossible. No native stationary, fixed-contour, full-history
or complex-domain admissibility is inferred from these real profile identities.
See [finding180](findings/180-higher-temporal-profile-and-real-norm-budget.md).
"""
lean_statement = "Artform.Scores.GravityBridge.Native.Full40.Statement.temporalProfileLaw"
lean_proof = "Artform.Scores.GravityBridge.Native.Full40.temporalProfileLaw"
reviewed = "2026-10-31"
review_text_sha256 = "1a725002b48056cbe19d699172031652d30e28d85b4d4b18d9223cf034e31454"

[[statement]]
