(T7, Latimer-MacDuffee) The laws of phase t, up to processing, correspond one to one with the classes of fractional ideals of A_t = S[λ]/(λ^2 - tλ + 1). The law T goes to the class of (c, λ - a). This entry is the surjectivity of the map. The Lean form holds over every principal ideal domain S with t^2 - 4 not a square in its fraction field; the ledger's S = F[x, 1/x] is one, which Lean proves in Euclid.lean by division on a dial. Every nonzero ideal I of A_t is in the class of (c, λ - a) for some law T of phase t. Every class of fractional ideals contains an integral ideal, which is why the Lean form speaks of the nonzero ideals of A_t. The law is the matrix of λ on an S-basis of I. It has determinant 1 and trace t, since it is conjugate over the fraction field to the companion tick, the matrix of λ on the basis 1, λ."""
lean_statement = "Artform.Scores.Statement.classesOnto"
lean_proof = "Artform.Scores.classesOnto"
