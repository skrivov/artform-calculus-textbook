name: Release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # As CI, plus a kernel replay of the library's compiled files.
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
          axiom-audit: true
          axiom-audit-root: "Artform"
          leanchecker: true
          leanchecker-args: "ArtformTextbook"
        env:
          LEAN_NUM_THREADS: "1"   # lean-action's advice for leanchecker with Mathlib
      - name: Status report
        run: |
          mkdir -p build
          lake env lean --run scripts/Report.lean > build/report.json
          python3 scripts/status.py --check
      - name: Files
        run: python3 scripts/check_tree.py
      # textbook/RELEASE-NOTES.md is written for each release; the guide's PDF
      # is attached from the first release on.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --notes-file textbook/RELEASE-NOTES.md
