name = "artform-calculus-textbook"
defaultTargets = ["ArtformTextbook", "Tutorial", "ArtformRoles"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

# The textbook's definitions, statements and proofs.  The options are the
# ones `lake new … math` writes, and they apply to this library only.
[[lean_lib]]
name = "ArtformTextbook"
srcDir = "textbook"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, weak.linter.mathlibStandardSet = true, maxSynthPendingDepth = 3 }

# The guide's Lean files, core Lean only. Each answer the guide quotes is
# pinned with #guard_msgs, so building this library checks the guide.
[[lean_lib]]
name = "Tutorial"
srcDir = "tutorial"
roots = ["LeanBasics", "ArtformChapter1", "RepositoryTour"]

# The role discipline of the type-theory paper (type-theory/paper/): the five
# roles, the dependency policy, constructions and histories.
[[lean_lib]]
name = "ArtformRoles"
srcDir = "type-theory"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, weak.linter.mathlibStandardSet = true, maxSynthPendingDepth = 3 }
